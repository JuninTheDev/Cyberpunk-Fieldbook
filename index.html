<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a1e">
  <title>Night City Fieldbook</title>
  <link rel="stylesheet" href="cyberpunk-css-main/cyberpunk-css-main/cyberpunk.css">
  <link rel="stylesheet" href="wiki.css">
  <link rel="stylesheet" href="netwire.css">
  <script>
    // O tema e a casca escolhidos no menu da conta (wikiApp.prefs "tema" e "casca"), antes de desenhar: sem piscar.
    try {
      const dono = localStorage.getItem('night-city-dono') || 'aparelho';
      // O 2077 é o padrão das duas wikis: só a escolha "fieldbook" (gravada) fica no amarelo.
      if ((JSON.parse(localStorage.getItem(`night-city-pref-${dono}-tema`) || 'null') || '2077') === '2077') document.documentElement.dataset.tema = '2077';
      if (JSON.parse(localStorage.getItem(`night-city-pref-${dono}-casca`) || 'null') === 'classica') document.documentElement.dataset.casca = 'classica';
    } catch { /* sem armazenamento: fica o padrão do CSS */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
</head>
<body>
  <div class="shell">
    <!-- A barra de cima vai de ponta a ponta, com a marca à esquerda (como nos exemplos de 2026). -->
    <header class="topbar">
      <div class="brand">
        <b class="brand-name">NIGHT CITY <em>FIELDBOOK</em></b>
        <div class="brand-mark">Guia de mesa // 2045–2077</div>
        <p>Regras rápidas e arquivo da campanha</p>
      </div>
      <div class="search-wrap">
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Buscar   ( / )" autocomplete="off" aria-label="Buscar na wiki: regra, NPC, local, pista">
      </div>
      <div class="top-meta">PROTOCOLO MORANA / ARQUIVO LOCAL</div>
    </header>
    <aside>
      <div class="workspace-tabs" role="tablist" aria-label="Área da wiki">
        <button class="workspace-tab" id="tab-campaigns" type="button" role="tab" aria-selected="true" data-workspace="campaigns">Campanhas</button>
        <button class="workspace-tab" id="tab-system" type="button" role="tab" aria-selected="false" data-workspace="system">Sistema</button>
      </div>
      <nav id="navigation" aria-label="Seções da wiki"></nav>
    </aside>
    <main>
      <article class="content" id="content" aria-live="polite"></article>
    </main>
  </div>
  <script src="system-catalog.js"></script>
  <script src="system-rules.js"></script>
  <script src="system-net.js"></script>
  <script src="system-2077.js"></script>
  <script src="system-blackchrome.js"></script>
  <script src="system-glossario.js"></script>
  <script src="system-criacao.js"></script>
  <script src="personagem-roles.js"></script>
  <script src="personagem-cyberware.js"></script>
  <script src="personagem-jogo.js"></script>
  <script src="loja-catalogo.js"></script>
  <script src="popup.js"></script>
  <script src="criador.js"></script>
  <script src="conta.js"></script>
  <script src="mestre-npcs.js"></script>
  <script src="campaign-map.js"></script>
  <script src="nightcity-map.js"></script>
  <script src="campanha-base.js"></script>
  <script src="jogadores-painel.js"></script>
  <script src="campanhas-painel.js"></script>
  <script src="netwire.js"></script>
  <script>
    // Visão do mestre: campanha, documentos e segredos. Nada daqui chega à visão dos jogadores.
    const sources = {
      core: 'pdfcoffee.com_cyberpunk-red-traduzido-por-mim-compress-pdf-free.pdf',
      2077: 'Cyberpunk 2077 - A Cyberpunk RED Supplement.pdf'
    };

    // As campanhas vêm do servidor (api/campanhas). O Protocolo Morana tem as páginas daqui; as outras, as páginas
    // comuns (campanhas-painel.js) e os documentos da pasta documentos/<id>/.
    // O menu do Protocolo Morana: cada entrada reúne em abas tudo o que é do mesmo assunto (tabs). As páginas das abas
    // continuam com o próprio endereço (#docBase, #docGuia...) e na busca; só saem da barra lateral.
    // As abas Handouts, NPCs e Notas das sessões e as Fichas do elenco são montadas por campanhas-painel.js (moranaExtras).
    const morana = { id: 'morana', name: 'Protocolo Morana', color: '#00ffd2', groups: [
        { group: 'Campanha ativa', pages: [
          { id: 'home', label: 'Resumo', icon: '00' },
          { id: 'docDiario', label: 'A campanha', icon: '01', tabs: [
            { id: 'docDiario', label: 'Diário' }, { id: 'docBase', label: 'Base' }
          ] },
          { id: 'people', label: 'Elenco', icon: '02', tabs: [
            { id: 'people', label: 'Pessoas e facções' }, { id: 'elencoFichas', label: 'Fichas' }
          ] },
          { id: 'campaignMap', label: 'Night City', icon: 'MAP', tabs: [
            { id: 'campaignMap', label: 'Mapa' }, { id: 'lugares', label: 'Lugares e peças' }, { id: 'docGuia', label: 'Guia de 2077' }
          ] }
        ]},
        { group: 'Sessões', pages: [
          { id: 'docSessaoZero', label: 'Sessão zero', icon: 'S0', className: 'session-item' },
          // A Sessão 01 já foi jogada: o que aconteceu (as notas e o registro do diário), os handouts entregues e as fichas.
          { id: 'sessao01Notas', label: 'Sessão 01: A Maleta', icon: 'S1', className: 'session-item', tabs: [{ id: 'sessao01Notas', label: 'O que aconteceu' }, { id: 'sessao01Handouts', label: 'Handouts' }, { id: 'sessao01Npcs', label: 'NPCs' }] },
          { id: 'docHandouts', label: 'Handouts e textos', icon: 'H', className: 'session-item' }
        ]},
        { group: 'Mesa', pages: [
          { id: 'notes', label: 'Estado da campanha', icon: 'N' },
          { id: 'caixa', label: 'Caixa do NetWire', icon: 'NW' },
          { id: 'playerView', label: 'Visão dos jogadores', icon: 'PV' },
          { id: 'agenda', label: 'Agenda das mesas', icon: 'AG' },
          { id: 'campanhas', label: 'Campanhas', icon: 'CP' }
        ]},
        { group: 'Personagens dos jogadores', pages: [
          { id: 'personagens', label: 'Personagens e códigos', icon: 'PC' },
          { id: 'loja', label: 'Loja', icon: 'EB' }
        ]}
      ]};

    // As abas montadas: os handouts de cada sessão (tirados de Handouts e textos), as fichas de NPC escolhidas e as
    // notas da sessão (as duas na mesa do servidor), e as fichas do elenco. npcs: a sugestão até o mestre mudar.
    const handoutsFile = 'documentos/morana/handouts-da-campanha.md';
    const diarioFile = 'documentos/morana/diario-da-campanha.md';
    // A base da campanha: um registro para cada pessoa, facção, lugar, peça, relógio e segredo (campanha-base.js).
    const baseFile = 'documentos/morana/base-da-campanha.md';
    const moranaSessions = [
      { n: '01', title: 'Sessão 01: A Maleta', diario: 'Sessão 1:', handouts: ['H-04', 'H-05'],
        npcs: ['Wakako Okada', 'Mina Kuroda', 'Vega', 'Operativo de segurança', 'Operativo de segurança', 'Netrunner', 'Guarda-costas', 'Tyger Claws'] }
    ];
    // cast: as fichas do elenco (as pessoas da base com ficha da campanha).
    const moranaExtras = cast => [
      ...moranaSessions.flatMap(({ n, title, diario, handouts, npcs }) => [
        { kind: 'handouts', id: `sessao${n}Handouts`, file: handoutsFile, eyebrow: `${title} / handouts`, title: 'Handouts da sessão', handouts },
        { kind: 'npcs', id: `sessao${n}Npcs`, key: `sessao${n}`, eyebrow: `${title} / fichas`, title: 'NPCs da sessão', npcs },
        { kind: 'notas', id: `sessao${n}Notas`, key: `sessao${n}`, eyebrow: `${title} / só você vê`, title: 'Notas da sessão', sessionTitle: title, diario, diarioFile }
      ]),
      { kind: 'npcs', id: 'elencoFichas', key: 'elenco', eyebrow: 'Elenco / fichas de combate', title: 'Fichas do elenco', npcs: cast,
        lede: 'As fichas dos NPCs nomeados do Protocolo Morana (as mesmas de Fichas de NPC e do compêndio do Foundry). Acrescente outras pelo seletor: um capanga de gangue, uma ficha do livro.' }
    ];

    // Páginas lidas direto dos arquivos .md: o texto de preparação é a única fonte. Cada campanha tem a sua pasta.
    const markdownDocs = {
      // As visões da base (vista: a página mostra parte do arquivo ou uma montagem dele; o link para o arquivo abre a Base).
      people: { file: baseFile, vista: true, prioridade: 3, eyebrow: 'Arquivo da campanha / elenco', title: 'Pessoas e facções', lede: 'Quem é quem, de que lado está, onde fica e o que muda na mesa. Passe o mouse num nome em qualquer documento para ver o cartão.', transform: text => window.campaignBase.pessoas(text) },
      lugares: { file: baseFile, vista: true, prioridade: 3, eyebrow: 'Night City / campanha', title: 'Lugares e peças', lede: 'As peças da campanha (com quem estão agora) e os lugares, com o ponto no mapa.', transform: text => window.campaignBase.lugares(text) },
      docBase: { file: baseFile, semBusca: true, eyebrow: 'Fonte única / edite aqui', title: 'Base da campanha', lede: 'O arquivo de onde saem Pessoas e facções, Lugares e peças, o Estado da campanha e as tabelas citadas nos documentos. Edite o .md: tudo muda junto.' },
      docHandouts: { entregar: 'morana', file: 'documentos/morana/handouts-da-campanha.md', eyebrow: 'Documento completo / para entregar', title: 'Handouts e textos da campanha', lede: 'Os documentos que os jogadores receberam e como criar um handout na hora. Embaixo de cada citação, os botões entregam pela wiki.' },
      docSessaoZero: { file: 'documentos/morana/sessao-zero.md', eyebrow: 'Documento completo / sessão zero', title: 'Sessão zero', lede: 'Linhas e véus, a carta X, o que Morana pode fazer com cada personagem, as regras da casa e as perguntas.' },
      docGuia: { file: 'documentos/morana/guia-night-city-2077.md', eyebrow: 'Documento completo / world building', title: 'Guia de Night City 2077', lede: 'Linha do tempo, relógio de 2077, distritos, poderes, gangues, NPCs do jogo e sessões avulsas.' },
      docDiario: { file: 'documentos/morana/diario-da-campanha.md', eyebrow: 'Documento completo / registro', title: 'Diário da campanha', lede: 'O estado de agora, as pessoas e o registro das sessões. Edite o arquivo .md depois de cada sessão.' }
    };


    const pageContent = {
      // O Início do mestre: o painel da mesa (setupHomeDesk) é montado na hora; o texto daqui fica só no título.
      home: {
        eyebrow: 'Protocolo Morana / mesa do mestre', title: 'Início',
        lede: 'A próxima sessão, a mesa, a Caixa do NetWire, os relógios e os personagens, num lugar só.',
        html: ''
      },
      campaignMap: {
        eyebrow: 'Protocolo Morana / mapa do mestre', title: 'Night City: quadro de operações',
        lede: 'Mapa de planejamento com locais da campanha, ganchos, encontros e atividades secundárias. Selecione um marcador para ver como usá-lo; os prédios exatos ficam em aberto para adaptação à mesa.',
        html: window.nightCityMap.renderPage(window.campaignMapData)
      },
      sources: {
        eyebrow: 'Biblioteca local / PDFs disponíveis', title: 'Livros de referência',
        lede: 'A mesa tem uma regra só: a do Cyberpunk Edgerunners Mission Kit e, no que ele não muda, a do livro-base RED. O Black Chrome é catálogo, e do suplemento comunitário de 2077 ficam só os itens que a mesa aprovou. Os arquivos originais ficam apenas como material de conferência.',
        html: `<div class="section"><h3>Material e status</h3><ul><li><b>Cyberpunk RED:</b> livro-base em português para criação, testes, combate, Roles, netrunning, equipamento e cyberware.</li><li><b>Cyberpunk Edgerunners Mission Kit</b> (R. Talsorian e CD Projekt, 2024): as regras e os itens oficiais dos anos 2070 (armas Power, Smart e Tech, Neuroport, quickhacks, Roles, Humanidade). Quando o Kit e o livro-base dizem coisas diferentes, vale o Kit.</li><li><b>Cyberpunk 2077 - A Cyberpunk RED Supplement:</b> suplemento comunitário de Queen Otter, não oficial. As regras dele não são mais usadas; os itens que a mesa aprovou estão nos catálogos, com a etiqueta "suplemento de fã", e a página Suplemento de fã lista o que saiu.</li><li><b>Veículos de 2077</b> (no Foundry): adaptação da wiki, com os carros do jogo nas classes de veículo do RED. Nem o Kit nem o suplemento trazem veículos.</li><li><b>Black Chrome</b> (R. Talsorian, 2023): o catálogo oficial de equipamento de 2045, com apps, cyberware, moda e armadura, equipamento, quadros lineares, veículos, armas e os Mercados Noturnos; e o <b>Black Chrome Plus</b>, a DLC grátis. O PDF do projeto é uma tradução automática e não tem as p. 61–66, 81–82 e 93–151: as armas e os veículos dessas páginas vêm das tabelas do fim do livro e do compêndio do Foundry, e a Economia 101 e os Mercados Noturnos A a E ficam de fora.</li></ul></div><div class="section"><h3>Mapa de consulta interna</h3><div class="table-wrap"><table><thead><tr><th>Área</th><th>Onde consultar</th></tr></thead><tbody><tr><td>Consulta durante a sessão</td><td>Escudo do mestre, Perícias por STAT</td></tr><tr><td>Criação, STATs e Lifepath</td><td>Criação de personagens</td></tr><tr><td>Testes, combate e dano</td><td>Testes e dificuldades, Combate, Dano, ferimentos e cura</td></tr><tr><td>Humanidade, terapia e drogas</td><td>Humanidade e drogas</td></tr><tr><td>Preços, moradia e estilo de vida</td><td>Economia</td></tr><tr><td>Perícias de Role e habilidades especiais</td><td>Roles</td></tr><tr><td>Cyberware RED</td><td>Famílias, slots, HL e exemplos</td></tr><tr><td>Armas e equipamento RED</td><td>Categorias, campos e comparação</td></tr><tr><td>Netrunning e quickhacks</td><td>Regras de netrunning, Quickhacks e o Arsenal da NET</td></tr><tr><td>O que saiu do suplemento de fã</td><td>Suplemento de fã</td></tr><tr><td>Campanha</td><td>Protocolo Morana, elenco e sessões</td></tr></tbody></table></div></div><div class="section"><h3>Critério de síntese</h3><p>Esta wiki organiza regras com palavras próprias, fornece referências rápidas e junta o Mission Kit e o livro-base numa regra só. Não reproduz integralmente os livros; use os arquivos para conferir uma tabela completa, uma exceção ou uma ficha exata.</p><p>Cada seção traz a página do PDF traduzido ("p. 186") para conferir no livro. A busca no topo encontra a seção exata, com ou sem acento, em português ou inglês.</p></div><div class="source-row"><a class="source-link" href="${sources.core}"><b>CORE</b> Material de conferência (PDF)</a><a class="source-link" href="${sources['2077']}"><b>2077</b> Material de conferência (PDF)</a></div>`
      }
    };

    // Página inicial do mestre, no desenho de 2026-10-29: três quadros (a próxima sessão, a mesa e a Caixa do NetWire),
    // os relógios, "Continuar de onde parou" e os atalhos, e os personagens dos jogadores com o HP. Montado na hora (não
    // entra na busca); cada quadro se preenche quando a resposta do servidor chega (sem servidor, fica o aviso).
    const DESK_ICONS = {
      screen: '<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/>',
      npcs: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/>',
      encounters: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',
      combat: '<circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
      glossary: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/>',
      indice: '<path d="M4 6h16M4 12h16M4 18h10"/>',
      sessao01Notas: '<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
      docDiario: '<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5"/>',
      docHandouts: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'
    };
    let deskListening = false;
    function setupHomeDesk(content, helpers) {
      // Aberto direto no #home, a página é desenhada antes de o wikiApp existir: monta quando ele fica pronto.
      if (!window.wikiApp) {
        document.addEventListener('wiki:pronta', () => { if (window.wikiApp.currentPage() === 'home' && !content.querySelector('.home-desk')) setupHomeDesk(content, helpers); }, { once: true });
        return;
      }
      const { recentPages, clockState, escapeHtml } = helpers;
      const app = window.wikiApp;
      const campaignId = (app.activeCampaign() || {}).id || 'morana';
      const shortcuts = [['screen', 'Escudo do mestre'], ['npcs', 'Fichas de NPC'], ['encounters', 'Encontros'], ['combat', 'Combate'], ['glossary', 'Glossário'], ['indice', 'Índice A–Z'], ['sessao01Notas', 'Sessão 01'], ['docDiario', 'Diário'], ['docHandouts', 'Handouts']];
      const clockNames = Object.fromEntries(((window.campaignBase.base || {}).relogios || []).map(item => [item.chave, item.nome]));
      const recent = recentPages();
      // Cada relógio com a barra de segmentos (os marcados em amarelo), o último marcado e o próximo.
      const segments = (steps, value) => `<span class="desk-clock" aria-hidden="true">${steps.map((_, index) => `<i${index < value ? ' class="on"' : ''}></i>`).join('')}</span>`;
      const clocks = clockState().map(({ name, steps, value }) => `<li><b>${escapeHtml(clockNames[name] || name)}: ${value}/${steps.length}</b>${segments(steps, value)}<small>${value ? `Último marcado: ${escapeHtml(steps[value - 1])}` : 'Nenhum segmento marcado'}${value < steps.length ? ` · próximo: ${escapeHtml(steps[value])}` : ''}</small></li>`).join('');
      const icon = id => `<svg class="desk-icon" viewBox="0 0 24 24" aria-hidden="true">${DESK_ICONS[id] || DESK_ICONS.docHandouts}</svg>`;
      // Um quadro do alto: a etiqueta, a linha grande, a de baixo, os detalhes e o botão.
      const card = (key, tag) => `<section class="desk-card" data-desk="${key}"><p class="desk-card-tag">${tag}</p><p class="desk-card-big">…</p><p class="desk-card-sub"></p><p class="desk-card-meta"></p><div class="desk-card-actions"></div></section>`;
      const block = document.createElement('div');
      block.className = 'home-desk';
      block.dataset.unitSkip = '';
      block.innerHTML = `<div class="desk-cards">${card('next', 'Próxima sessão')}${card('table', 'Mesa')}${card('inbox', 'Caixa do NetWire')}</div>
        <div class="desk-grid">
          <div class="desk-col"><h3 class="desk-title">Relógios</h3>${clocks ? `<ul class="desk-clocks">${clocks}</ul>` : '<p class="note-status">Nenhum relógio na base da campanha.</p>'}<button class="action ghost" type="button" data-page="notes">Estado da campanha</button></div>
          <div class="desk-col"><h3 class="desk-title">Continuar de onde parou</h3>${recent.length ? `<ul class="desk-recent">${recent.slice(0, 5).map(item => `<li><a href="${escapeHtml(item.hash)}">${escapeHtml(item.title)}</a>${item.section ? `<small> › ${escapeHtml(item.section)}</small>` : ''}</li>`).join('')}</ul>` : '<p class="note-status">As páginas que você abrir aparecem aqui.</p>'}</div>
          <div class="desk-col"><h3 class="desk-title">Atalhos</h3><div class="desk-buttons">${shortcuts.map(([id, label]) => `<button class="action ghost" type="button" data-page="${id}">${icon(id)}${label}</button>`).join('')}</div></div>
        </div>
        <div class="desk-people" hidden><h3 class="desk-title">Personagens</h3><div class="desk-people-grid"></div></div>`;
      (content.querySelector('.rule') || content.querySelector('.lede')).after(block);
      // Os botões do título: marcar a sessão e abrir a mesa (este, só com o Foundry no ar).
      const head = content.querySelector('.page-head');
      if (head) head.insertAdjacentHTML('beforeend', '<div class="desk-head-actions"><button class="nw-btn" type="button" data-page="agenda">Marcar sessão</button><a class="nw-btn nw-btn--primary" data-desk-open-table target="_blank" rel="noopener" hidden>Abrir a mesa</a></div>');
      const fill = (key, { big, sub = '', meta = '', actions = '', tone = '' }) => {
        const box = block.querySelector(`[data-desk="${key}"]`);
        if (!box) return;
        box.querySelector('.desk-card-big').textContent = big;
        box.querySelector('.desk-card-big').className = `desk-card-big${tone ? ` desk-${tone}` : ''}`;
        box.querySelector('.desk-card-sub').textContent = sub;
        box.querySelector('.desk-card-meta').innerHTML = meta;
        box.querySelector('.desk-card-actions').innerHTML = actions;
      };
      // A próxima sessão (da Agenda das mesas, no servidor).
      fill('next', { big: 'Sem agenda', sub: 'A agenda vem do servidor.', actions: '<button class="nw-btn" type="button" data-page="agenda">Agenda</button>' });
      fetch('api/agenda', { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).then(data => {
        if (!data || !block.isConnected) return;
        const next = (data.sessoes || []).find(item => item.campanha === campaignId && Date.parse(item.inicio) + item.duracao * 60000 > Date.now());
        const when = next && app.sessionTime(next);
        fill('next', next
          ? { big: next.titulo || 'Sessão marcada', sub: when.curto, meta: escapeHtml(when.relativo), actions: '<button class="nw-btn" type="button" data-page="agenda">Agenda</button>' }
          : { big: 'Nenhuma marcada', sub: 'Marque na Agenda das mesas.', actions: '<button class="nw-btn" type="button" data-page="agenda">Marcar</button>' });
      }).catch(() => { /* sem servidor: fica o aviso */ });
      // A mesa (o último api/estado; muda sozinha quando a barra lateral confere de novo).
      drawDeskTable(app.status());
      if (!deskListening) { deskListening = true; document.addEventListener('wiki:estado', event => drawDeskTable(event.detail)); }
      // A Caixa do NetWire: os rascunhos (da IA ou seus) e as conversas esperando a sua resposta.
      fill('inbox', { big: '…', actions: '<button class="nw-btn" type="button" data-page="caixa">Abrir caixa</button>' });
      fetch(`api/netwire?campanha=${encodeURIComponent(campaignId)}`, { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).then(data => {
        if (!data || !block.isConnected) return;
        const drafts = (data.mensagens || []).filter(item => item.estado === 'rascunho').length;
        const waiting = (data.aguardando || []).length;
        const total = drafts + waiting;
        const line = (count, one, many) => (count ? `<span>${count} ${count > 1 ? many : one}</span>` : '');
        fill('inbox', { big: total ? `${total} ${total > 1 ? 'itens pendentes' : 'item pendente'}` : 'Nada pendente', tone: total ? 'warn' : '', sub: total ? '' : 'Nenhum rascunho nem resposta esperando.', meta: `${line(drafts, 'rascunho', 'rascunhos')}${line(waiting, 'resposta esperando', 'respostas esperando')}`, actions: '<button class="nw-btn" type="button" data-page="caixa">Abrir caixa</button>' });
      }).catch(() => fill('inbox', { big: 'Sem a Caixa', sub: 'A Caixa vem do servidor.' }));
      // Os personagens dos jogadores nesta campanha, com o retrato, a Role e o HP (o da mesa, quando houver).
      fetch(`api/personagens?campanha=${encodeURIComponent(campaignId)}`, { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).then(data => {
        const list = (data && data.personagens) || [];
        const holder = block.querySelector('.desk-people');
        if (!list.length || !holder) return;
        const roleName = id => (window.playerAccount && window.playerAccount.roleName(id)) || id || '';
        holder.querySelector('.desk-people-grid').innerHTML = list.map(item => {
          const hp = item.numeros && item.numeros.hp;
          const on = hp ? Math.round((hp.atual / hp.max) * 10) : 0;
          const name = `${item.nome || 'Sem nome'}${item.apelido ? ` “${item.apelido}”` : ''}`;
          const face = item.retrato ? `<img class="desk-person-face" src="${escapeHtml(item.retrato)}" alt="">` : `<span class="desk-person-face">${escapeHtml((item.nome || '?').slice(0, 1))}</span>`;
          return `<a class="desk-person" href="#ficha/${encodeURIComponent(item.id)}">${face}<span class="desk-person-text"><b>${escapeHtml(name)}</b><small>${escapeHtml(roleName(item.role))}${item.donoNome ? ` · ${escapeHtml(item.donoNome)}` : ''}</small>${hp ? `<span class="desk-person-hp"><span class="nw-bar" aria-hidden="true">${Array.from({ length: 10 }, (_, index) => `<i${index < on ? ' class="on"' : ''}></i>`).join('')}</span><small>${hp.atual}/${hp.max}</small></span>` : ''}</span></a>`;
        }).join('');
        holder.hidden = false;
      }).catch(() => { /* sem servidor: sem a fileira */ });
    }
    // O quadro da mesa e o botão "Abrir a mesa" do título, pelo api/estado.
    function drawDeskTable(state) {
      const box = document.querySelector('.home-desk [data-desk="table"]');
      if (!box) return;
      const mesa = state && state.mesa;
      const big = box.querySelector('.desk-card-big');
      const [text, tone, sub] = !mesa ? ['Sem mesa', '', 'Esta wiki não vê o Foundry.']
        : !mesa.online ? ['Fora do ar', 'bad', 'O Foundry não respondeu.']
          : mesa.aberta ? ['Aberta', 'on', `Foundry${mesa.foundry ? ` ${mesa.foundry}` : ''} no ar`]
            : ['Sem mundo', 'warn', 'Foundry ligado, sem mundo aberto'];
      big.textContent = text;
      big.className = `desk-card-big${tone ? ` desk-${tone}` : ''}`;
      box.querySelector('.desk-card-sub').textContent = sub;
      box.querySelector('.desk-card-meta').innerHTML = mesa && mesa.online ? `<span>${mesa.usuarios || 0} ${mesa.usuarios === 1 ? 'conectado' : 'conectados'}</span>` : '';
      const link = mesa && mesa.online && mesa.url ? window.wikiApp.escapeHtml(mesa.url) : '';
      box.querySelector('.desk-card-actions').innerHTML = link ? `<a class="nw-btn nw-btn--primary" href="${link}" target="_blank" rel="noopener">Entrar na mesa</a>` : '<button class="nw-btn" type="button" data-page="notes">Estado da campanha</button>';
      const open = document.querySelector('[data-desk-open-table]');
      if (open) { open.hidden = !link; if (link) open.setAttribute('href', mesa.url); }
    }

    // Livros de referência: os PDFs ficam fora do git (são grandes e de terceiros), então só existem no PC do mestre.
    // Onde o arquivo não está (no servidor online), o link vira um aviso em vez de dar erro.
    function setupSources(content) {
      content.querySelectorAll('.source-link').forEach(link => {
        fetch(link.getAttribute('href'), { method: 'HEAD', cache: 'no-store' }).then(response => {
          if (response.ok || !link.isConnected) return;
          const note = document.createElement('span');
          note.className = 'source-link source-missing';
          note.innerHTML = `${link.querySelector('b').outerHTML} Só no PC do mestre (o PDF não vai para o servidor)`;
          link.replaceWith(note);
        }).catch(() => {});
      });
    }

    // Notas de campanha nas páginas de regras. Ficam aqui (e não nos arquivos system-*.js)
    // para nunca chegarem à visão dos jogadores. "name" é a seção ou o cartão onde a nota entra. As de Morana saíram
    // com a trama antiga (2026-10-20) e voltam com a nova.
    const gmNote = text => `<div class="callout gm-note"><b>Na campanha:</b> ${text}</div>`;
    const gmTip = text => `<p class="entry-tip gm-note"><b>Na campanha:</b> ${text}</p>`;
    const gmNotes = [
      { page: 'creation', name: 'Lifepath e identidade', html: '<p class="gm-note"><b>Na campanha:</b> cruze o Lifepath com os ganchos pessoais da sessão zero.</p>' }
    ];

    // Monta a wiki com as campanhas do servidor. Sem servidor (arquivo aberto com dois cliques), só o Protocolo Morana.
    // O Estado da campanha: os relógios, as peças, as pessoas e os segredos da base (campanha-base.js) e o bloco de mesa.
    const notesPage = () => ({
      eyebrow: 'Mesa do mestre / só você vê', title: 'Estado da campanha',
      lede: 'O que mudou na mesa: os relógios, com quem estão as peças de Morana, a situação de cada pessoa e os segredos que o grupo já descobriu. Fica salvo no servidor, com o backup, igual no PC e no tablet, e aparece nas páginas da base e nos cartões dos nomes. No fim da sessão, o bloco vira o rascunho do resumo para os jogadores (Virar rascunho de sessão).',
      html: `${window.campaignBase.paginaEstado()}<div class="section" data-toc="Bloco de mesa"><h3>Bloco de mesa</h3><textarea id="session-note" class="note-area" placeholder="Cena atual, iniciativa, nomes, pistas, dívidas, consequências..."></textarea><p class="note-status" id="note-status">Salvo automaticamente neste navegador.</p><button class="action" id="clear-notes" type="button">Limpar notas</button> <button class="action" data-session-draft type="button" title="Cria uma sessão não publicada, com este bloco, em Visão dos jogadores → Sessões">Virar rascunho de sessão</button> <button class="action" data-page="docDiario" type="button">Abrir diário da campanha</button></div>`
    });
    // Os documentos citam a base: uma linha {{base:...}} vira a tabela de agora (as visões já trazem a própria montagem).
    for (const doc of Object.values(markdownDocs)) if (!doc.transform) doc.transform = text => window.campaignBase.citar(text);
    // O nome do arquivo .md → a página do documento inteiro (para os links dos textos da base).
    const docPage = name => Object.keys(markdownDocs).find(id => markdownDocs[id].file.endsWith(`/${name}`) && !markdownDocs[id].vista) || '';

    // A Caixa do NetWire: o esqueleto que o netwire.js preenche.
    const netwireInbox = {
      eyebrow: 'NetWire / caixa do mestre', title: 'Caixa do NetWire',
      lede: 'As mensagens dentro do jogo: rascunhos, agendadas, as conversas esperando a sua resposta e os canais. Nada chega aos jogadores sem você entregar.',
      html: '<div data-nw-gm></div>'
    };
    function startWiki(list) {
      const manager = window.campaignManager;
      const built = manager.build(list, { morana, markdownDocs });
      const base = window.campaignBase;
      const extras = manager.extraPages('morana', moranaExtras(base.elenco()));
      const moranaPages = [...morana.groups.flatMap(group => group.pages.flatMap(page => [page.id, ...(page.tabs || []).map(tab => tab.id)])), ...Object.keys(extras.pages), ...Object.keys(extras.markdownDocs), ...Object.keys(markdownDocs)];
      base.ligar({ paginas: moranaPages, paginaDoArquivo: docPage });
      window.wikiConfig = {
        campaigns: built.campaigns,
        markdownDocs: { ...markdownDocs, ...built.markdownDocs, ...extras.markdownDocs },
        pageContent: { ...pageContent, notes: notesPage(), caixa: netwireInbox, ...(window.npcStatBlocks ? window.npcStatBlocks.pages : {}), ...(window.playerManager ? { playerView: window.playerManager.page } : {}), ...built.pages, ...extras.pages },
        clocks: base.relogiosDaWiki(),
        // Páginas que viraram parte de outra: o endereço antigo continua abrindo.
        aliases: { docQuemEQuem: { id: 'people', section: 'quem-e-quem' }, campaign: { id: 'docDiario' }, session1: { id: 'sessao01Notas' }, docSessao01: { id: 'sessao01Notas' } },
        gmNotes,
        pageSetup: { playerView: () => window.playerManager && window.playerManager.setup(), caixa: content => window.netwire && window.netwire.setupGm(content), home: setupHomeDesk, sources: setupSources, ...built.pageSetup, ...extras.pageSetup },
        homePage: 'home',
        // A Caixa do NetWire (netwire.js): as mensagens dentro do jogo, para revisar, agendar e responder.
        netwire: 'mestre',
        // As abas do topo (a casca NetWire), pelos nomes dos grupos: valem para o Protocolo Morana e para as campanhas
        // criadas na página Campanhas (campanhas-painel.js). Mensagens, por enquanto, é a Visão dos jogadores. No celular, a
        // barra de baixo leva as abas com "celular" (Sessões, Personagens e Sistema ficam no Menu).
        topTabs: [
          { id: 'inicio', label: 'Início', inicio: true, celular: 1 },
          { id: 'campanha', label: 'Campanha', celular: 2, grupos: ['Campanha ativa', 'Campanha', 'Documentos', 'Outros documentos', 'Night City (todas as campanhas)'] },
          { id: 'sessoes', label: 'Sessões', grupos: ['Sessões'] },
          { id: 'mensagens', label: 'Mensagens', curto: 'Msgs', celular: 3, paginas: ['caixa', 'playerView'] },
          { id: 'mesa', label: 'Mesa', celular: 4, grupos: ['Mesa'] },
          { id: 'personagens', label: 'Personagens', curto: 'PCs', grupos: ['Personagens dos jogadores'] },
          { id: 'sistema', label: 'Sistema', area: 'system', pagina: 'screen' }
        ],
        topMeta: campaign => `${campaign.name} / arquivo do mestre`.toUpperCase(),
        // Relógios e bloco de notas da campanha, no servidor (com o backup), iguais em qualquer aparelho do mestre.
        tableUrl: campaign => `api/campanhas/${encodeURIComponent(campaign)}/mesa`,
        confirmCampaignChange: next => (window.playerManager ? window.playerManager.confirmLeave(next) : Promise.resolve(true)),
        // Alerta quando um arquivo da campanha volta para uma versão antiga (OneDrive).
        healthUrl: 'api/saude',
        // Mesa do Foundry, versão no ar e "Sair do modo mestre", na barra lateral.
        statusUrl: 'api/estado'
      };
      const script = document.createElement('script');
      script.src = 'wiki-app.js';
      document.body.appendChild(script);
    }
    // A base da campanha (e o estado dela na mesa do servidor) é lida antes de montar a wiki: as páginas, os relógios e
    // os links dos nomes saem dela.
    if (location.protocol === 'file:') window.campaignBase.carregar(baseFile, '').then(() => startWiki(null), () => startWiki(null));
    else Promise.all([
      fetch('api/campanhas', { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).catch(() => null),
      window.campaignBase.carregar(baseFile, 'api/campanhas/morana/mesa').catch(() => null)
    ]).then(([data]) => startWiki(data));
  </script>
</body>
</html>
