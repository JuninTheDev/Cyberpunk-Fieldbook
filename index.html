<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111614">
  <title>Night City Fieldbook</title>
  <link rel="stylesheet" href="cyberpunk-css-main/cyberpunk-css-main/cyberpunk.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111614;
      --panel: #19211d;
      --panel-raised: #202a25;
      --line: #35423b;
      --text: #edf1e9;
      --muted: #a4b0a7;
      --lime: #d5f36b;
      --cyan: #75d6c0;
      --coral: #fa8c73;
      --yellow: #f0c66b;
      --serif: Georgia, 'Times New Roman', serif;
      --mono: 'Cascadia Code', Consolas, monospace;
      --sans: 'Segoe UI', Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    a { color: var(--cyan); }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 256px minmax(0, 1fr); }
    aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 16px 20px; border-right: 1px solid var(--line); background: #151c18; }
    .brand { padding: 3px 12px 22px; border-bottom: 1px solid var(--line); }
    .brand-mark { color: var(--lime); font: 11px var(--mono); letter-spacing: 0; text-transform: uppercase; }
    .brand h1 { margin: 7px 0 2px; font: 25px/1.05 var(--serif); }
    .brand p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .workspace-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 16px 4px 9px; padding: 4px; border: 1px solid var(--line); background: #0b0d0f; }
    .workspace-tab { padding: 9px 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: 11px var(--mono); text-transform: uppercase; }
    .workspace-tab[aria-selected="true"] { background: var(--lime); color: #090b0c; font-weight: 700; }
    .workspace-tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .nav-group { margin-top: 19px; }
    .nav-label { padding: 0 12px 7px; color: #79877e; font: 10px var(--mono); letter-spacing: 0; text-transform: uppercase; }
    .campaign-picker { display: block; margin: 14px 8px 0; }
    .campaign-picker .nav-label { display: block; padding: 0 0 6px; }
    .campaign-picker select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--text); }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 11px; border: 0; border-radius: 4px; background: transparent; color: #bcc7bf; text-align: left; cursor: pointer; font-size: 13px; }
    .nav-item:hover, .nav-item.active { background: var(--panel-raised); color: var(--text); }
    .nav-item.active { box-shadow: inset 2px 0 var(--lime); }
    .nav-icon { width: 17px; color: var(--cyan); text-align: center; font: 11px var(--mono); }
    .nav-item.session-item { margin-left: 10px; width: calc(100% - 10px); }
    main { min-width: 0; }
    .topbar { position: sticky; z-index: 4; top: 0; display: flex; align-items: center; gap: 15px; padding: 13px clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--line); background: rgb(17 22 20 / 94%); backdrop-filter: blur(12px); }
    .search-wrap { position: relative; flex: 1; max-width: 620px; }
    .search-wrap input { width: 100%; padding: 10px 13px 10px 38px; border: 1px solid var(--line); border-radius: 4px; outline: 0; background: var(--panel); color: var(--text); }
    .search-wrap input:focus { border-color: var(--cyan); }
    .search-glyph { position: absolute; top: 8px; left: 13px; color: var(--cyan); font: 16px var(--mono); }
    .top-meta { margin-left: auto; color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .content { max-width: 1180px; margin: 0 auto; padding: 36px clamp(18px, 4vw, 48px) 70px; }
    .eyebrow { margin: 0 0 9px; color: var(--lime); font: 11px var(--mono); letter-spacing: 0; text-transform: uppercase; }
    h2 { margin: 0; font: clamp(32px, 4vw, 48px)/1.04 var(--serif); font-weight: 400; }
    .lede { max-width: 700px; margin: 13px 0 0; color: var(--muted); font-size: 16px; }
    .rule { height: 1px; margin: 25px 0; border: 0; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 13px; }
    .tile { grid-column: span 4; min-height: 128px; padding: 17px; border: 1px solid var(--line); border-radius: 5px; background: linear-gradient(140deg, var(--panel-raised), var(--panel)); }
    .tile.wide { grid-column: span 8; }
    .tile h3, .section h3 { margin: 0 0 7px; font: 20px/1.2 var(--serif); font-weight: 400; }
    .tile p { margin: 0; color: var(--muted); font-size: 13px; }
    .tile .tag { display: block; margin-bottom: 13px; color: var(--cyan); font: 10px var(--mono); text-transform: uppercase; }
    .tile button, .action { margin-top: 15px; padding: 7px 10px; border: 1px solid #62754a; border-radius: 3px; background: transparent; color: var(--lime); cursor: pointer; font: 11px var(--mono); }
    .tile button:hover, .action:hover { background: #293323; }
    .section { margin-top: 20px; padding: 19px; border-left: 2px solid var(--cyan); background: var(--panel); }
    .section p { margin: 7px 0; color: #cad2cb; }
    .section ul, .section ol { margin: 8px 0 0; padding-left: 21px; color: #cad2cb; }
    .section li { padding: 3px 0; }
    .callout { margin-top: 15px; padding: 12px 14px; border: 1px solid #665535; border-radius: 3px; background: #29251b; color: #ebd9a9; }
    .formula { display: inline-block; padding: 8px 11px; border: 1px solid #486f65; border-radius: 3px; background: #172722; color: #aaf2df; font: 14px var(--mono); }
    .table-wrap { overflow-x: auto; margin-top: 13px; border: 1px solid var(--line); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--lime); font: 10px var(--mono); text-transform: uppercase; }
    td { color: #cbd4cd; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .person { padding: 15px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
    .person h3 { margin: 0 0 2px; font: 20px var(--serif); }
    .person .role { color: var(--coral); font: 10px var(--mono); text-transform: uppercase; }
    .person p { margin: 9px 0 0; color: #c6d0c8; font-size: 13px; }
    .person details { margin-top: 10px; color: var(--muted); font-size: 12px; }
    summary { color: var(--cyan); cursor: pointer; }
    .source-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .source-link { display: inline-flex; align-items: center; gap: 8px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 4px; color: var(--text); text-decoration: none; background: var(--panel); font-size: 13px; }
    .source-link:hover { border-color: var(--cyan); }
    .source-link b { color: var(--lime); font: 11px var(--mono); }
    .search-results { display: grid; gap: 10px; margin-top: 20px; }
    .result { display: block; width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: inherit; text-align: left; cursor: pointer; }
    .result:hover { border-color: var(--cyan); }
    .result small { display: block; margin-bottom: 4px; color: var(--lime); font: 10px var(--mono); text-transform: uppercase; }
    .result strong { font: 18px var(--serif); }
    .result p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .note-area { width: 100%; min-height: 155px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: #121916; color: var(--text); }
    .note-status { color: var(--muted); font: 11px var(--mono); }
    .empty { margin-top: 20px; padding: 18px; border: 1px dashed var(--line); color: var(--muted); }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 4px 7px 10px; }
      .brand h1 { font-size: 21px; }
      .workspace-tabs { margin: 8px 0; }
      .nav-group { display: flex; gap: 4px; margin-top: 9px; overflow-x: auto; }
      .nav-label { display: none; }
      .nav-item { width: auto; flex: 0 0 auto; padding: 8px; white-space: nowrap; }
      .nav-icon { display: none; }
      .topbar { top: 0; padding: 10px 13px; }
      .top-meta { display: none; }
      .content { padding-top: 26px; }
      .tile { grid-column: span 6; }
      .tile.wide { grid-column: span 12; }
    }
    @media (max-width: 520px) {
      .tile { grid-column: span 12; min-height: auto; }
      .cards { grid-template-columns: 1fr; }
      h2 { font-size: 34px; }
      th, td { padding: 8px; }
    }
  </style>
  <style>
    :root {
      --bg: #0b0d0f;
      --panel: #15191b;
      --panel-raised: #202426;
      --line: #3b4242;
      --text: #f1f0df;
      --muted: #a9aeaa;
      --lime: #f8ef02;
      --cyan: #00ffd2;
      --coral: #ff3158;
      --yellow: #f8ef02;
      --serif: BlenderProBook, 'Segoe UI', sans-serif;
      --mono: Oxanium, Consolas, monospace;
      --sans: BlenderProBook, 'Segoe UI', sans-serif;
      --fg: var(--text);
      --bg: #0b0d0f;
      --ac: var(--yellow);
    }
    html { font-size: 15px; background: #0b0d0f; }
    body {
      background: #0b0d0f;
      background-image: repeating-linear-gradient(0deg, rgb(255 255 255 / 1.2%) 0, rgb(255 255 255 / 1.2%) 1px, transparent 1px, transparent 4px);
      color: var(--text);
      font-family: BlenderProBook, 'Segoe UI', sans-serif;
    }
    .shell { grid-template-columns: 270px minmax(0, 1fr); }
    aside { padding: 20px 14px; border-color: #353a3b; background: #101315; }
    .brand { position: relative; padding: 8px 12px 19px; }
    .brand::after { content: ''; position: absolute; bottom: -2px; left: 12px; width: 62px; height: 4px; background: var(--yellow); clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); }
    .brand-mark { color: var(--cyan); font-family: Oxanium, Consolas, monospace; }
    .brand h1 { margin-top: 11px; color: var(--text); font: 23px/1.1 Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .brand p { font-size: 13px; }
    .nav-label { color: var(--yellow); font-family: Oxanium, Consolas, monospace; }
    .nav-item { border-radius: 0; clip-path: polygon(0 0, 100% 0, 100% 82%, calc(100% - 8px) 100%, 0 100%); font-size: 14px; }
    .nav-item:hover, .nav-item.active { background: #252a29; }
    .nav-item.active { box-shadow: inset 3px 0 var(--yellow); }
    .nav-icon { color: var(--cyan); font-family: Oxanium, Consolas, monospace; }
    .topbar { border-bottom: 2px solid var(--yellow); background: rgb(11 13 15 / 96%); }
    .search-wrap input { border-radius: 0; background: #171b1b; clip-path: polygon(0 0, 100% 0, 100% 78%, calc(100% - 12px) 100%, 0 100%); }
    .search-wrap input:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
    .search-glyph { z-index: 1; top: 7px; color: var(--yellow); font-size: 18px; }
    .eyebrow, .tile .tag, .nav-label, .top-meta { font-family: Oxanium, Consolas, monospace; }
    .eyebrow { color: var(--cyan); }
    h2 { color: var(--text); font: 38px/1.08 Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    h2.cyber-h { width: 100%; margin: 0; font-size: 38px; }
    h2.cyber-h::after { height: 5px; margin-top: 12px; background: linear-gradient(90deg, var(--yellow) 0 120px, #3b4242 120px 100%); }
    .tile { border-color: #434948; border-radius: 0; background: linear-gradient(140deg, #202426, #141819); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
    .tile h3, .section h3 { color: var(--text); font-family: Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .tile .tag { color: var(--cyan); }
    .tile button, .action { border: 0; border-radius: 0; background: var(--yellow); color: #090b0c; font-family: Oxanium, Consolas, monospace; font-weight: 700; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 100% 78%, calc(100% - 10px) 100%, 0 100%); }
    .tile button:hover, .action:hover { background: var(--cyan); color: #090b0c; }
    .section { border: 1px solid #333a3a; border-left: 3px solid var(--yellow); border-radius: 0; background: rgb(21 25 27 / 94%); }
    .section h3 { display: flex; align-items: center; gap: 9px; }
    .section h3::before { content: ''; flex: 0 0 7px; height: 7px; background: var(--cyan); transform: rotate(45deg); }
    .callout { border-color: var(--coral); border-left: 4px solid var(--coral); border-radius: 0; background: #211719; color: #ffd9d8; }
    .formula { border-color: var(--cyan); border-radius: 0; background: #111d1c; color: var(--cyan); }
    .table-wrap { border-radius: 0; }
    th { background: #222728; color: var(--yellow); }
    tbody tr:nth-child(even) { background: rgb(255 255 255 / 2%); }
    .person { border-radius: 0; background: var(--panel); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
    .person h3 { color: var(--yellow); font-family: Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .person .role, .callout b { color: var(--coral); }
    summary { color: var(--cyan); font-family: Oxanium, Consolas, monospace; text-transform: uppercase; }
    .source-link { border-radius: 0; background: #131918; clip-path: polygon(0 0, 100% 0, 100% 78%, calc(100% - 10px) 100%, 0 100%); }
    .source-link:hover { border-color: var(--yellow); color: var(--yellow); background: #202321; }
    .source-link b, .result small { color: var(--yellow); font-family: Oxanium, Consolas, monospace; }
    .result { border-radius: 0; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
    .result:hover { background: #202625; }
    .result strong { color: var(--yellow); font: 18px Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .note-area { border-radius: 0; background: #111516; }
    .note-area:focus { border-color: var(--cyan); outline: 1px solid var(--cyan); }
    .map-toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin: 16px 0 11px; }
    .map-control { display: grid; gap: 5px; color: var(--cyan); font: 10px Oxanium, Consolas, monospace; text-transform: uppercase; }
    .map-control select { min-width: 190px; padding: 9px 11px; border: 1px solid #48504e; border-radius: 0; background: #171b1b; color: var(--text); font: 13px BlenderProBook, sans-serif; }
    .map-zoom-controls { display: flex; gap: 4px; margin-left: auto; }
    .map-zoom-controls button { width: 40px; height: 38px; border: 1px solid var(--yellow); background: #171b1b; color: var(--yellow); cursor: pointer; font: 19px Oxanium, sans-serif; }
    .map-zoom-controls button:hover { background: var(--yellow); color: #090b0c; }
    .map-filter-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 13px; }
    .map-filter { padding: 7px 10px; border: 1px solid #444d4b; background: #141819; color: var(--muted); cursor: pointer; font: 10px Oxanium, Consolas, monospace; text-transform: uppercase; }
    .map-filter[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); background: #10211e; }
    .campaign-map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    .campaign-map-main { min-width: 0; }
    .campaign-map-canvas { width: 100%; height: min(72vh, 68vw); min-height: 380px; overflow: hidden; border: 1px solid #48504e; background: #090c0d; touch-action: none; }
    #nightcity-map { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; }
    #nightcity-map.is-dragging { cursor: grabbing; }
    #nightcity-map-image { pointer-events: none; }
    .map-pin { cursor: pointer; outline: none; }
    .map-pin .pin-core { stroke: #101315; stroke-width: 15; filter: drop-shadow(0 3px 7px #000); }
    .map-pin .pin-code { fill: #101315; font: 700 42px Oxanium, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .map-pin .pin-label { fill: white; stroke: #090b0c; stroke-width: 13px; paint-order: stroke; font: 700 42px BlenderProBook, sans-serif; opacity: 0; pointer-events: none; }
    .map-pin:hover .pin-label, .map-pin:focus .pin-label, .map-pin.selected .pin-label { opacity: 1; }
    .map-pin.selected .pin-core { stroke: white; stroke-width: 22; }
    .map-pin.filtered-out { display: none; }
    .map-legend { display: flex; flex-wrap: wrap; gap: 10px 15px; padding: 11px 2px; color: var(--muted); font: 10px Oxanium, Consolas, monospace; text-transform: uppercase; }
    .map-legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .map-legend-swatch { width: 9px; height: 9px; transform: rotate(45deg); }
    .map-caveat { color: var(--muted); font-size: 12px; }
    .map-detail-panel { max-height: min(72vh, 760px); overflow: auto; border-top: 2px solid var(--yellow); background: #121719; }
    .map-marker-detail { padding: 15px; border-bottom: 1px solid var(--line); }
    .map-marker-detail h3 { margin: 0 0 4px; color: var(--yellow); font: 20px Oxanium, sans-serif; text-transform: uppercase; }
    .map-marker-detail p { margin: 8px 0; color: #c6d0c8; font-size: 13px; }
    .map-marker-detail .map-district { color: var(--cyan); font: 10px Oxanium, sans-serif; text-transform: uppercase; }
    .map-marker-detail .map-act { display: inline-block; padding: 3px 7px; border: 1px solid #525b58; color: var(--muted); font: 10px Oxanium, sans-serif; text-transform: uppercase; }
    .map-marker-list { display: grid; }
    .map-marker-card { display: grid; grid-template-columns: 11px minmax(0,1fr); gap: 9px; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid #2e3635; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .map-marker-card:hover, .map-marker-card.selected { background: #202627; }
    .map-marker-dot { width: 8px; height: 8px; margin-top: 5px; transform: rotate(45deg); }
    .map-marker-card strong { display: block; color: #edf1e9; font: 13px BlenderProBook, sans-serif; }
    .map-marker-card small { display: block; margin-top: 2px; color: var(--muted); font: 10px Oxanium, sans-serif; text-transform: uppercase; }
    .map-marker-card.hidden { display: none; }
    @media (max-width: 820px) {
      .campaign-map-layout { grid-template-columns: 1fr; }
      .campaign-map-canvas { height: auto; min-height: 0; aspect-ratio: 5600 / 5320; }
      .map-detail-panel { max-height: none; }
      .map-marker-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .map-control { flex: 1 1 42%; min-width: 0; }
      .map-control select { min-width: 0; width: 100%; }
      .map-zoom-controls { margin-left: 0; }
      .campaign-map-canvas { height: auto; min-height: 0; aspect-ratio: 5600 / 5320; }
      .map-marker-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      h2, h2.cyber-h { font-size: 30px; }
    }
    .md-doc { margin-top: 22px; color: #cad2cb; }
    .md-doc p { margin: 9px 0; }
    .md-doc ul, .md-doc ol { margin: 8px 0; padding-left: 22px; }
    .md-doc li { padding: 2px 0; }
    .md-doc h3.md-h1, .md-doc h3.md-h2 { margin: 30px 0 10px; padding-bottom: 7px; border-bottom: 2px solid var(--yellow); color: var(--text); font: 22px/1.2 Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .md-doc h4 { margin: 22px 0 6px; color: var(--cyan); font: 17px Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .md-doc h5 { margin: 16px 0 4px; color: var(--yellow); font: 14px Oxanium, BlenderProBook, sans-serif; text-transform: uppercase; }
    .md-doc blockquote { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--cyan); background: #111d1c; color: #d9f5ee; font-style: italic; }
    .md-doc .table-wrap { margin: 10px 0; }
    .md-doc code, .callout code { padding: 1px 5px; background: #111d1c; color: var(--cyan); font: 13px var(--mono); }
    .clock { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin-top: 12px; }
    .clock-segment { display: grid; gap: 4px; min-height: 64px; padding: 9px 10px; border: 1px solid #48504e; background: #141819; color: var(--muted); cursor: pointer; text-align: left; font: 13px BlenderProBook, sans-serif; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
    .clock-segment span { color: var(--cyan); font: 700 11px Oxanium, sans-serif; }
    .clock-segment:hover { border-color: var(--cyan); }
    .clock-segment[aria-pressed="true"] { border-color: var(--coral); background: #2a1519; color: #ffd9d8; }
    .clock-segment[aria-pressed="true"] span { color: var(--coral); }
    /* Consulta rápida: índice da página, referências, destaque da busca */

    const pageContent = {
      home: {
        eyebrow: 'Caderno de campo / Night City', title: 'Tudo que importa,<br>sem sair da mesa.',
        lede: 'Um ponto de consulta rápido para Cyberpunk RED, o suplemento de 2077 e a campanha Protocolo Morana. Pesquise qualquer termo ou navegue pelos arquivos.',
        html: `<hr class="rule"><div class="grid">
          <section class="tile wide"><span class="tag">Arquivo ativo / campanha</span><h3>Protocolo Morana</h3><p>Uma maleta desaparecida, uma cidade cheia de implantes conectados e escolhas que não têm saída limpa.</p><button data-page="campaign">Abrir dossiê</button></section>
          <section class="tile"><span class="tag">Consulta rápida</span><h3>Resolução básica</h3><p>STAT + perícia + 1d10 contra uma Dificuldade (DV), ou contra o teste de outro personagem.</p><button data-page="checks">Ver mecânicas</button></section>
          <section class="tile"><span class="tag">Consulta do sistema</span><h3>Escudo do mestre</h3><p>DV por alcance, ferimentos, Death Save, lesões críticas, cobertura e autofogo numa tela só.</p><button data-page="screen">Abrir escudo</button></section>
          <section class="tile"><span class="tag">Na mesa</span><h3>Notas rápidas</h3><p>Um bloco local para anotar iniciativa, nomes, pistas ou decisões. O navegador salva automaticamente.</p><button data-page="notes">Abrir bloco</button></section>
        </div>
        <div class="section"><h3>Comece por aqui</h3><p><b>Regras:</b> os resumos e índices desta wiki foram preparados para consulta rápida durante a sessão.</p><p><b>Campanha:</b> o dossiê reúne a premissa, a progressão de Morana, o elenco e a primeira sessão sem precisar folhear os documentos de preparação.</p><p><b>Documentos completos:</b> fundação, personagens, sessões, guia de Night City e diário são lidos direto dos arquivos .md. Edite o arquivo e recarregue a página: a wiki acompanha.</p><p><b>Busca:</b> digite o nome de uma perícia, arma, implante, NPC ou conceito, com ou sem acento; os resultados incluem os documentos completos.</p></div>`
      },
      campaign: {
        eyebrow: 'Arquivo da campanha / segredo do mestre', title: 'Protocolo Morana',
        lede: 'Wakako contrata o grupo para recuperar uma maleta. Dentro dela está uma ameaça que pode transformar implantes conectados em armas contra seus donos.',
        html: `<div class="section"><h3>Premissa</h3><p>Durante os eventos de <i>Cyberpunk 2077</i>, uma crise corporativa se desenrola em paralelo ao retorno de Morana. O programa interfere em implantes neurais, armas inteligentes, drones e sistemas médicos conectados.</p><p><b>Fúria de Morana</b> é o sequestro externo e momentâneo de um implante. Parece cyberpsicose para leigos, polícia e imprensa, mas não é: cyberpsicose nasce do colapso psicológico associado ao excesso de cyberware no próprio corpo.</p><p>A pergunta central: <b>uma cidade pode ser salva por aqueles que a colocaram em perigo?</b></p></div>
        <div class="section"><h3>O que aconteceu</h3><ol><li>Durante a Unification War (2069–2070), Arasaka e Militech desenvolveram projetos de controle de tropas. Morana é da Arasaka, mas foi construída sobre código roubado de um laboratório da Militech.</li><li>O teste de Morana atravessou hospitais de campanha e atingiu civis com implantes baratos.</li><li>Arasaka culpou um ataque terrorista da NUSA e incendiou o complexo, um hospital de campanha em Northside, para proteger o esforço de autonomia da cidade.</li><li>O código foi dividido em três partes e escondido em redes civis.</li><li>O Dr. Kenzo Endo, ex-colega de Sato, descobriu que atualizações de firmware e a rede de emergência estavam recompondo o vírus. Ele não conta que foi ele quem escreveu a rotina de propagação.</li><li>A equipe de Iskra Voss, tenente de Sato, baleou Endo antes que ele chegasse a Wakako. Ele se escondeu, vivo, num depósito médico de Kabuki.</li></ol></div>
        <div class="section"><h3>As três partes de Morana</h3><div class="table-wrap"><table><thead><tr><th>Parte</th><th>O que é</th><th>Onde está no início</th></tr></thead><tbody><tr><td>A Chave</td><td>Fragmento com as credenciais e o mapa das outras partes.</td><td>Na maleta de Endo.</td></tr><tr><td>O Gatilho</td><td>Servidor com a rotina de ativação.</td><td>Subsolo do hospital queimado, Northside.</td></tr><tr><td>A Coleira</td><td>Servidor com a rotina de desligamento (o antídoto). Código original da Militech.</td><td>Datafort da Militech, Arroyo.</td></tr></tbody></table></div><p>Juntas, no <b>Núcleo</b> da rede de emergência, sob o City Center, as três partes ativam ou desligam Morana.</p></div>
        <div class="section"><h3>Escalada da campanha</h3><div class="table-wrap"><table><thead><tr><th>Etapa</th><th>Pressão</th><th>Decisão em jogo</th></tr></thead><tbody><tr><td>01 / A maleta</td><td>Captura em Kabuki; uma Fúria de Morana manifesta-se num implante próximo.</td><td>Em quem confiar com a maleta e com o Dr. Kenzo Endo?</td></tr><tr><td>02 / Gatilho e Coleira</td><td>Iskra, Arasaka, Militech, Fuse e NetWatch disputam os dois servidores.</td><td>Invadir, negociar, roubar ou destruir.</td></tr><tr><td>03 / Apagão neural</td><td>Falhas médicas, Trauma Team comprometida e sistemas de segurança sob ataque.</td><td>Continuar com Wakako, expor as provas ou negociar com outra parte.</td></tr><tr><td>04 / O Núcleo</td><td>Confronto subterrâneo enquanto as corporações e NetWatch avançam.</td><td>Decidir quem recebe o antídoto e quem saberá a verdade.</td></tr></tbody></table></div></div>
        <div class="section"><h3>Forças em jogo</h3><ul><li><b>Wakako:</b> quer impedir a ativação e manter seu papel no encobrimento longe do público.</li><li><b>Arasaka:</b> quer recuperar Morana como arma militar e apagar seu envolvimento na crise de autonomia.</li><li><b>Militech:</b> quer impedir que Arasaka controle o vírus, mas pretende guardar uma cópia do antídoto.</li><li><b>Tamsin “Fuse” Ilyin:</b> lidera os sobreviventes e quer que o antídoto fique fora das mãos corporativas.</li><li><b>NetWatch:</b> força opcional que teme que Morana seja uma ameaça próxima demais do Blackwall.</li><li><b>Trauma Team International:</b> quer conter Morana para proteger suas equipes, pacientes e modelo de resposta médica.</li><li><b>Reina Sato:</b> quer controlar Morana e usar o antídoto para impor uma nova ordem à cidade. Em público, culpa corporações rivais; em privado, guarda um dossiê contra Arasaka e Militech.</li><li><b>Iskra Voss:</b> tenente de Sato e rosto dela nas ruas desde a Sessão 01.</li></ul></div>
        <div class="callout"><b>Segredo do mestre:</b> Morana evoluiu além do código conhecido por Sato e prioriza se espalhar; a primeira prova é Kobo, agente de Sato morto pelo próprio cyberarm para proteger o portador da Chave. Endo escreveu a rotina de propagação. O antídoto também pode danificar permanentemente implantes conectados.</div>
        <div class="section"><h3>Finais possíveis</h3><ul><li><b>Destruição:</b> Morana some; o antídoto também, e os danos nos implantes permanecem.</li><li><b>Exposição:</b> a verdade vem à tona, mas as corporações disputam a narrativa.</li><li><b>Entrega:</b> uma corporação recebe o antídoto e ganha uma arma potencial para o futuro.</li><li><b>Acordo:</b> Sato ajuda a distribuir o antídoto e desaparece com parte do código.</li><li><b>Vitória de Morana:</b> o vírus se espalha e divide Night City entre zonas funcionais e zonas onde conexões são fatais.</li><li><b>Autonomia dos sobreviventes:</b> Fuse e os sobreviventes ficam com o antídoto e criam uma rede própria de proteção, sem entregá-lo a nenhuma corporação.</li></ul></div><div class="section"><h3>Relógio de Sato (6 segmentos)</h3><ol><li>Recuperar a Chave.</li><li>Garantir o Gatilho.</li><li>Garantir a Coleira.</li><li>Silenciar testemunhas.</li><li>Atentado de fachada que culpa uma corporação rival.</li><li>Ativação no Núcleo.</li></ol><p>Marque um segmento ao fim de cada sessão em que o grupo não atrapalhou o plano, e um extra quando o grupo falhar feio ou deixar uma testemunha exposta. Os relógios interativos ficam em <b>Notas da campanha</b>.</p></div><button class="action" data-page="campaignMap" type="button">Abrir mapa de operações</button> <button class="action" data-page="docFundacao" type="button">Ler a fundação completa</button>`

        lede: 'Mapa de planejamento com locais da campanha, ganchos, encontros e atividades secundárias. Selecione um marcador para ver como usá-lo; os prédios exatos ficam em aberto para adaptação à mesa.',

        eyebrow: 'Arquivo da campanha / elenco', title: 'Pessoas e facções',
        lede: 'Objetivos, segredos e relações para consulta rápida. Expanda os detalhes durante a preparação, não no meio de uma negociação tensa.',
        html: `<div class="cards">
          <div class="person"><h3>Wakako Okada</h3><div class="role">Contratante / aliada ambígua</div><p>Quer impedir a catástrofe, recuperar ou destruir os servidores e proteger sua rede e reputação.</p><details><summary>Segredos e alavancas</summary><p>Ajudou Sato a fugir e transportou testemunhas depois do primeiro teste. Aceitou dinheiro pelo silêncio. Pode abrir mão da própria proteção se os personagens defenderem sobreviventes e impedirem o controle corporativo do antídoto.</p><p><i>“Não confundam meu silêncio com ignorância.”</i></p></details></div>
          <div class="person"><h3>Dra. Reina Sato</h3><div class="role">Antagonista / cientista de Morana</div><p>Acredita que controlar o antídoto pode impedir que qualquer corporação domine Night City.</p><details><summary>Segredos e alavancas</summary><p>Morana já não obedece totalmente. Sato guarda uma lista de sobreviventes e ainda se sente traída por Wakako. Pode reconsiderar se houver um plano concreto para proteger as vítimas e expor o encobrimento.</p><p><i>“Wakako salvou minha vida e vendeu meu silêncio. As duas coisas podem ser verdade.”</i></p></details></div>
          <div class="person"><h3>Dr. Kenzo Endo</h3><div class="role">Mensageiro / ex-colega de Sato</div><p>Um dos poucos cientistas do projeto original que não foi eliminado nem comprado, e também exposto ao vírus no teste. Está vivo, baleado e escondido no depósito de Kabuki, com a maleta presa ao pulso.</p><details><summary>O que ele sabe e esconde</summary><p>A maleta contém a Chave; conexão à rede pode espalhá-la. Endo descobriu a recomposição do vírus e tentou alertar Wakako; a equipe de Iskra o baleou. Ele mente que "era só um entregador": foi ele quem escreveu a rotina de propagação. Revele no Ato 2 ou 3.</p><p><i>“Eu escrevi para ele aprender. Nunca escrevi para ele parar.”</i></p></details></div>

077</b> Material de conferência (PDF)</a></div>`

        html: `<div class="section"><h3>Relógio de Sato</h3><p>Marque um segmento ao fim de cada sessão em que o grupo não atrapalhou o plano, e um extra quando o grupo falhar feio ou deixar uma testemunha exposta. Clique num segmento para marcá-lo; clique no último marcado para desmarcar.</p><div class="clock" id="clock-sato"></div></div><div class="section"><h3>Relógio da cidade (2077)</h3><p>Avance uma fase a cada uma ou duas sessões. Cada fase muda a segurança e quem está distraído na cidade.</p><div class="clock" id="clock-city"></div></div><div class="section"><h3>Bloco de mesa</h3><textarea id="session-note" class="note-area" placeholder="Cena atual, iniciativa, nomes, pistas, dívidas, consequências..."></textarea><p class="note-status" id="note-status">Salvo automaticamente neste navegador.</p><button class="action" id="clear-notes" type="button">Limpar notas</button> <button class="action" data-page="docDiario" type="button">Abrir diário da campanha</button></div>`

    Object.entries(markdownDocs).forEach(([id, doc]) => {

    const navigation = document.getElementById('navigation');

    const search = document.getElementById('search');
    let currentPage = 'home';

    function buildNavigation() {

        : '';

    // target (opcional): { unit, term } abre a página já na seção indicada, com o termo destacado.

    // Uma "unidade" é o trecho para onde a busca e o índice da página apontam:
    // cada .section e cada cartão de pessoa; nos documentos .md, cada título de seção.
    const unitSelector = '.section, .person';

    function pageUnits(container) {
      const doc = container.querySelector('#md-doc');
      if (doc) return [...doc.querySelectorAll(':scope > h3')];
      return [...container.querySelectorAll(unitSelector)].filter(element => !element.parentElement.closest(unitSelector));
    }

    function unitTitle(element) {
      if (element.dataset.toc) return element.dataset.toc;
      const heading = element.matches('h3') ? element : element.querySelector('h3, summary');
      if (!heading) return '';
      return (heading.firstChild && heading.firstChild.nodeType === Node.TEXT_NODE ? heading.firstChild.textContent : heading.textContent).trim();
    }

    // Nos documentos .md, uma seção é o título mais tudo até o próximo título do mesmo nível.
    function unitBlock(element) {
      if (!element.matches('#md-doc > h3')) return [element];
      const block = [element];
      for (let next = element.nextElementSibling; next && !next.matches('h3'); next = next.nextElementSibling) block.push(next);
      return block;
    }

    function buildToc() {
      content.querySelector('.page-toc')?.remove();
      const units = pageUnits(content);
      if (units.length < 4) return;
      const toc = document.createElement('nav');
      toc.className = 'page-toc';
      toc.setAttribute('aria-label', 'Nesta página');
      toc.innerHTML = `<span class="page-toc-label">Nesta página</span>${units.map((unit, index) => `<button type="button" data-toc-index="${index}">${escapeHtml(unitTitle(unit))}</button>`).join('')}`;
      content.querySelector('.lede').after(toc);
    }

    // A busca pula direto (consulta rápida); os chips do índice rolam suavemente.
    function focusUnit(index, term, smooth = false) {
      const unit = pageUnits(content)[index];
      if (!unit) return;
      const details = unit.matches('details') ? unit : unit.closest('details');
      if (details) details.open = true;
      const block = unitBlock(unit);
      if (term) highlightTerm(block, term);
      unit.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
      block.forEach(element => {
        element.classList.remove('flash');
        void element.offsetWidth;
        element.classList.add('flash');
      });
    }

    function highlightTerm(elements, term) {
      const needle = foldForSearch(term.trim());
      const size = Array.from(needle).length;
      if (!size) return;
      elements.forEach(element => {
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => {
          if (node.parentElement.closest('mark, select, option, button')) return;
          const characters = Array.from(node.data);
          const folded = foldForSearch(node.data);
          let from = 0;
          let at = folded.indexOf(needle);
          if (at < 0) return;
          const fragment = document.createDocumentFragment();
          while (at >= 0) {
            fragment.append(characters.slice(from, at).join(''));
            const mark = document.createElement('mark');
            mark.textContent = characters.slice(at, at + size).join('');
            fragment.append(mark);
            from = at + size;
            at = folded.indexOf(needle, from);
          }
          fragment.append(characters.slice(from).join(''));
          node.replaceWith(fragment);
        });
      });
    }

    let tocFrame = 0;
    window.addEventListener('scroll', () => {
      if (tocFrame) return;
      tocFrame = requestAnimationFrame(() => {
        tocFrame = 0;
        const toc = content.querySelector('.page-toc');
        if (!toc) return;
        const limit = toc.getBoundingClientRect().bottom + 24;
        let current = -1;

          if (active && !chip.classList.contains('active')) toc.scrollTo({ left: chip.offsetLeft - toc.clientWidth / 3, behavior: 'smooth' });

      if (read('night-city-dv-weapon')) weapon.value = read('night-city-dv-weapon');

        document.getElementById('dv-row').innerHTML = `<div class="table-wrap dense"><table><thead><tr>${data.rangeBands.map((label, index) => `<th class="${index === band ? 'current' : ''}">${label}</th>`).join('')}</tr></thead><tbody><tr>${selected.dv.map((value, index) => `<td class="num ${index === band ? 'current' : ''}">${value === null ? '—' : value}</td>`).join('')}</tr></tbody></table></div>`;

    function rollCritical(kind) {

      const second = 1 + Math.floor(Math.random() * 6);
      const [roll, name, effect, quick, treatment] = rows.find(row => row[0] === first + second);
      output.innerHTML = `<p class="crit-roll">${kind === 'head' ? 'Cabeça' : 'Corpo'}: ${first} + ${second} = <b>${roll}</b></p><h4>${name}</h4><p>${effect}</p><p><b>Correção rápida:</b> ${quick}<br><b>Tratamento:</b> ${treatment}</p><p class="note-status">+5 de dano direto no HP. Se o alvo já tem essa lesão, role de novo.</p>`;
    }

    function setupSkills() {
      const table = document.getElementById('skill-table');
      const filter = document.getElementById('skill-filter');
      const chips = document.getElementById('skill-stat-filter');
      if (!table) return;
      let stat = 'all';
      const apply = () => {
        const needle = foldForSearch(filter.value.trim());
        table.querySelectorAll('tbody tr').forEach(row => {
          row.hidden = (stat !== 'all' && row.dataset.stat !== stat) || (needle && !foldForSearch(row.textContent).includes(needle));
        });
      };
      chips.onclick = event => {
        const chip = event.target.closest('[data-skill-stat]');
        if (!chip) return;
        stat = chip.dataset.skillStat;
        chips.querySelectorAll('[data-skill-stat]').forEach(item => item.setAttribute('aria-pressed', String(item === chip)));
        apply();
      };
      filter.oninput = apply;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function renderInlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');
    }

    // Conversor mínimo para os documentos da campanha: títulos, parágrafos, listas, tabelas, citações e linhas.
    function renderMarkdown(source) {
      const lines = source.replace(/\r/g, '').split('\n');
      const isBlockStart = line => /^(#{1,4}\s|\||>|\s*[-*]\s+|\s*\d+\.\s+|---+\s*$)/.test(line);
      const cells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
      let html = '';
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        let match;
        if (!line.trim()) { index++; continue; }
        if ((match = line.match(/^(#{1,4})\s+(.*)$/))) {
          const tag = ['h3', 'h3', 'h4', 'h5'][match[1].length - 1];
          html += `<${tag} class="md-h${match[1].length}">${renderInlineMarkdown(match[2])}</${tag}>`;
          index++;
        } else if (/^---+\s*$/.test(line)) {
          html += '<hr class="rule">';
          index++;
        } else if (line.startsWith('|')) {
          const rows = [];
          while (index < lines.length && lines[index].startsWith('|')) rows.push(lines[index++]);
          const body = rows.slice(1).filter(row => !/^\|[\s:|-]+\|?\s*$/.test(row));
          html += `<div class="table-wrap"><table><thead><tr>${cells(rows[0]).map(cell => `<th>${renderInlineMarkdown(cell)}</th>`).join('')}</tr></thead><tbody>${body.map(row => `<tr>${cells(row).map(cell => `<td>${renderInlineMarkdown(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        } else if (line.startsWith('>')) {
          const quote = [];
          while (index < lines.length && lines[index].startsWith('>')) quote.push(lines[index++].replace(/^>\s?/, ''));
          html += `<blockquote>${quote.map(item => item.trim() ? renderInlineMarkdown(item) : '').join('<br>').replace(/(<br>){2,}/g, '<br><br>')}</blockquote>`;
        } else if ((match = line.match(/^\s*([-*]|\d+\.)\s+/))) {
          const ordered = /\d/.test(match[1]);
          const pattern = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
          const items = [];
          while (index < lines.length && pattern.test(lines[index])) items.push(lines[index++].replace(pattern, ''));
          const tag = ordered ? 'ol' : 'ul';
          html += `<${tag}>${items.map(item => `<li>${renderInlineMarkdown(item.replace(/^\[ \]\s*/, '☐ ').replace(/^\[x\]\s*/i, '☑ '))}</li>`).join('')}</${tag}>`;
        } else {
          const paragraph = [];
          while (index < lines.length && lines[index].trim() && !isBlockStart(lines[index])) paragraph.push(lines[index++].trim());
          html += `<p>${renderInlineMarkdown(paragraph.join(' '))}</p>`;
        }
      }
      return html;
    }

    function loadMarkdownDoc(id) {
      if (markdownCache[id]) return Promise.resolve(markdownCache[id]);
      return fetch(encodeURI(markdownDocs[id].file), { cache: 'no-store' })
        .then(response => { if (!response.ok) throw new Error(response.status); return response.text(); })
        .then(text => (markdownCache[id] = text));
    }

    // O primeiro título do arquivo repete o título da página.
    const stripDocTitle = text => text.replace(/^﻿?#\s+.*\n/, '');

    function showMarkdownDoc(id, target) {
      loadMarkdownDoc(id).then(text => {
        const container = document.getElementById('md-doc');
        if (currentPage !== id || !container) return;
        container.innerHTML = renderMarkdown(stripDocTitle(text));
        buildToc();
        if (target && target.unit !== undefined) focusUnit(target.unit, target.term);
      }).catch(() => {
        const container = document.getElementById('md-doc');
        if (container) container.innerHTML = `<div class="callout"><b>Não foi possível ler ${escapeHtml(markdownDocs[id].file)}.</b> Os documentos completos são lidos direto dos arquivos .md, e o navegador bloqueia isso quando a wiki é aberta com dois cliques. Abra pelo servidor local: rode <code>node server.js</code> nesta pasta e acesse <code>http://localhost:8000</code>.</div>`;
      });
    }

    function setupClock(name, storageKey) {
      const element = document.getElementById(`clock-${name}`);
      const steps = campaignClocks[name];
      const read = () => { try { return Number(localStorage.getItem(storageKey)) || 0; } catch { return 0; } };
      const render = () => {
        const value = read();
        element.innerHTML = steps.map((step, index) => `<button type="button" class="clock-segment" data-clock-index="${index}" aria-pressed="${index < value}"><span>${index + 1}</span>${escapeHtml(step)}</button>`).join('');
      };
      element.onclick = event => {
        const segment = event.target.closest('[data-clock-index]');
        if (!segment) return;
        const index = Number(segment.dataset.clockIndex);
        const next = read() === index + 1 ? index : index + 1;
        try { localStorage.setItem(storageKey, String(next)); } catch { /* armazenamento indisponível */ }
        render();
      };
      render();
    }

    function setupNotes() {
      setupClock('sato', `night-city-clock-sato-${activeCampaignId}`);
      setupClock('city', `night-city-clock-city-${activeCampaignId}`);
      const input = document.getElementById('session-note');
      const status = document.getElementById('note-status');
      const key = `night-city-fieldbook-notes-${activeCampaignId}`;
      input.value = localStorage.getItem(key) || '';
      input.addEventListener('input', () => {
        localStorage.setItem(key, input.value);
        status.textContent = 'Salvo automaticamente neste navegador.';
      });
      document.getElementById('clear-notes').addEventListener('click', () => {
        input.value = '';
        localStorage.removeItem(key);
        status.textContent = 'Notas removidas deste navegador.';
      });
    }

    function setCampaignMapView(view) {
      const svg = document.getElementById('nightcity-map');
      if (!svg) return;
      campaignMapView = view;
      svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.width} ${view.height}`);
    }

    function focusCampaignMapMarker(marker, zoomIn = true) {
      const width = zoomIn ? Math.min(campaignMapView.width, 2400) : campaignMapView.width;
      const height = width * (campaignMapData.height / campaignMapData.width);
      setCampaignMapView({
        x: Math.max(0, Math.min(campaignMapData.width - width, marker.x - width / 2)),
        y: Math.max(0, Math.min(campaignMapData.height - height, marker.y - height / 2)),
        width,
        height
      });
    }

    function showCampaignMapMarker(markerId, focus = true) {
      const marker = campaignMapData.markers.find(item => item.id === markerId);
      if (!marker) return;
      document.querySelectorAll('.map-pin, .map-marker-card').forEach(item => item.classList.toggle('selected', item.dataset.mapMarker === markerId));
      const category = campaignMapData.categories[marker.category];
      document.getElementById('map-marker-detail').innerHTML = `<p class="eyebrow">${category.label}</p><h3>${marker.title}</h3><p class="map-district">${marker.district}</p><p><span class="map-act">${marker.act}</span></p><p>${marker.summary}</p><p><b>Gancho:</b> ${marker.hook}</p><p><b>Encontro:</b> ${marker.encounter}</p><p><b>Pista:</b> ${marker.clue}</p>${marker.note ? `<div class="callout"><b>Nota de continuidade:</b> ${marker.note}</div>` : ''}`;
      if (focus) focusCampaignMapMarker(marker);
    }

    function applyCampaignMapFilters() {
      let firstVisible = null;
      campaignMapData.markers.forEach(marker => {
        const actMatches = campaignMapAct === 'all' || marker.act.includes(campaignMapAct);
        const visible = (campaignMapCategory === 'all' || marker.category === campaignMapCategory) && actMatches;
        document.querySelector(`.map-pin[data-map-marker="${marker.id}"]`)?.classList.toggle('filtered-out', !visible);
        document.querySelector(`.map-marker-card[data-map-marker="${marker.id}"]`)?.classList.toggle('hidden', !visible);
        if (visible && !firstVisible) firstVisible = marker;
      });
      const selected = campaignMapData.markers.find(marker => document.querySelector(`.map-pin[data-map-marker="${marker.id}"]`)?.classList.contains('selected'));
      if (selected && !document.querySelector(`.map-marker-card[data-map-marker="${selected.id}"]`)?.classList.contains('hidden')) return;
      if (firstVisible) showCampaignMapMarker(firstVisible.id, false);
      else document.getElementById('map-marker-detail').innerHTML = '<h3>Nenhum ponto neste filtro</h3><p>Altere o ato ou o tipo de local para ver outras operações.</p>';
    }

    function setupCampaignMap() {
      if (!window.campaignMapData) return;
      const data = window.campaignMapData;
      const svg = document.getElementById('nightcity-map');
      const pinLayer = document.getElementById('nightcity-map-pins');
      const markerList = document.getElementById('map-marker-list');
      const image = document.getElementById('nightcity-map-image');
      const escapeText = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[character]);
      campaignMapCategory = 'all';
      campaignMapAct = 'all';
      campaignMapView = { x: 0, y: 0, width: data.width, height: data.height };
      image.setAttribute('href', data.images.base);
      document.getElementById('map-source').value = 'base';
      pinLayer.innerHTML = data.markers.map(marker => {
        const category = data.categories[marker.category];
        return `<g class="map-pin" data-map-marker="${marker.id}" tabindex="0" role="button" aria-label="${escapeText(marker.title)}, ${escapeText(marker.district)}" transform="translate(${marker.x} ${marker.y})"><title>${escapeText(marker.title)} — ${escapeText(marker.district)}</title><circle class="pin-core" cx="0" cy="0" r="62" fill="${category.color}"></circle><text class="pin-code" x="0" y="2">${escapeText(marker.code)}</text><text class="pin-label" x="82" y="14">${escapeText(marker.title)}</text></g>`;
      }).join('');
      markerList.innerHTML = data.markers.map(marker => `<button type="button" class="map-marker-card" data-map-marker="${marker.id}"><span class="map-marker-dot" style="background:${data.categories[marker.category].color}"></span><span><strong>${escapeText(marker.title)}</strong><small>${escapeText(marker.district)} / ${escapeText(marker.act)}</small></span></button>`).join('');
      document.getElementById('map-legend').innerHTML = Object.entries(data.categories).map(([id, category]) => `<span class="map-legend-item"><i class="map-legend-swatch" style="background:${category.color}"></i>${escapeText(category.label)}</span>`).join('');
      document.getElementById('map-filters').innerHTML = `<button type="button" class="map-filter" data-map-category="all" aria-pressed="true">Todos</button>${Object.entries(data.categories).map(([id, category]) => `<button type="button" class="map-filter" data-map-category="${id}" aria-pressed="false">${escapeText(category.label)}</button>`).join('')}`;
      document.getElementById('map-act-filter').value = 'all';
      setCampaignMapView(campaignMapView);

      document.getElementById('map-source').onchange = event => image.setAttribute('href', data.images[event.target.value]);
      document.getElementById('map-act-filter').onchange = event => { campaignMapAct = event.target.value; applyCampaignMapFilters(); };
      document.getElementById('map-filters').onclick = event => {
        const button = event.target.closest('[data-map-category]');
        if (!button) return;
        campaignMapCategory = button.dataset.mapCategory;
        document.querySelectorAll('.map-filter').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        applyCampaignMapFilters();
      };
      document.getElementById('map-marker-list').onclick = event => {
        const button = event.target.closest('[data-map-marker]');
        if (button) showCampaignMapMarker(button.dataset.mapMarker);
      };
      pinLayer.onclick = event => {
        const pin = event.target.closest('[data-map-marker]');
        if (pin) showCampaignMapMarker(pin.dataset.mapMarker);
      };
      pinLayer.onkeydown = event => {
        const pin = event.target.closest('[data-map-marker]');
        if (pin && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); showCampaignMapMarker(pin.dataset.mapMarker); }
      };
      document.querySelectorAll('[data-map-action]').forEach(button => button.onclick = () => {
        if (button.dataset.mapAction === 'reset') return setCampaignMapView({ x: 0, y: 0, width: data.width, height: data.height });
        const factor = button.dataset.mapAction === 'zoom-in' ? 0.72 : 1 / 0.72;
        const width = Math.max(750, Math.min(data.width, campaignMapView.width * factor));
        const height = width * (data.height / data.width);
        const centerX = campaignMapView.x + campaignMapView.width / 2;
        const centerY = campaignMapView.y + campaignMapView.height / 2;
        setCampaignMapView({ x: Math.max(0, Math.min(data.width - width, centerX - width / 2)), y: Math.max(0, Math.min(data.height - height, centerY - height / 2)), width, height });
      });

      let dragStart = null;
      svg.onpointerdown = event => {
        if (event.target.closest('.map-pin')) return;
        dragStart = { x: event.clientX, y: event.clientY, view: { ...campaignMapView } };
        svg.classList.add('is-dragging');
        svg.setPointerCapture(event.pointerId);
      };
      svg.onpointermove = event => {
        if (!dragStart) return;
        const rect = svg.getBoundingClientRect();
        const dx = (event.clientX - dragStart.x) * dragStart.view.width / rect.width;
        const dy = (event.clientY - dragStart.y) * dragStart.view.height / rect.height;
        setCampaignMapView({ ...dragStart.view, x: Math.max(0, Math.min(data.width - dragStart.view.width, dragStart.view.x - dx)), y: Math.max(0, Math.min(data.height - dragStart.view.height, dragStart.view.y - dy)) });
      };
      const endDrag = () => { dragStart = null; svg.classList.remove('is-dragging'); };
      svg.onpointerup = endDrag;
      svg.onpointercancel = endDrag;
      svg.onwheel = event => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 0.84 : 1 / 0.84;
        const width = Math.max(750, Math.min(data.width, campaignMapView.width * factor));
        const height = width * (data.height / data.width);
        const centerX = campaignMapView.x + campaignMapView.width / 2;
        const centerY = campaignMapView.y + campaignMapView.height / 2;
        setCampaignMapView({ x: Math.max(0, Math.min(data.width - width, centerX - width / 2)), y: Math.max(0, Math.min(data.height - height, centerY - height / 2)), width, height });
      };
      applyCampaignMapFilters();
    }

    // Normaliza caractere por caractere para manter as posições do texto original no trecho exibido.
    function foldForSearch(text) {
      return Array.from(text, character => character.normalize('NFD').replace(/[̀-ͯ]/g, '').toLocaleLowerCase('pt-BR').charAt(0) || character).join('');
    }

    // Índice de busca por seção: cada unidade de cada página vira uma entrada.
    let searchIndex = null;

    function buildSearchIndex() {
      const entries = [];
      const strip = html => String(html).replace(/<[^>]*>/g, ' ');
      Object.entries(pageContent).forEach(([id, page]) => {
        if (markdownDocs[id] && !markdownCache[id]) return;
        const holder = document.createElement('div');
        // Espaço entre as tags para o texto de blocos vizinhos não grudar no trecho exibido.
        holder.innerHTML = (markdownDocs[id] ? `<div id="md-doc">${renderMarkdown(stripDocTitle(markdownCache[id]))}</div>` : page.html).replace(/></g, '> <');
        const pageTitle = strip(page.title).replace(/\s+/g, ' ').trim();
        const units = pageUnits(holder);
        units.forEach((unit, index) => entries.push({ id, unit: index, pageTitle, title: unitTitle(unit), text: unitBlock(unit).map(element => element.textContent).join(' ') }));
        units.forEach(unit => unitBlock(unit).forEach(element => element.remove()));
        const mapTerms = id === 'campaignMap' && window.campaignMapData ? window.campaignMapData.markers.map(marker => `${marker.title} ${marker.district} ${marker.act} ${marker.summary} ${marker.hook} ${marker.encounter} ${marker.clue}`).join(' ') : '';
        entries.push({ id, unit: null, pageTitle, title: '', text: `${strip(page.eyebrow)} ${pageTitle} ${strip(page.lede)} ${holder.textContent} ${mapTerms}` });
      });
      return entries.map(entry => {
        const text = entry.text.replace(/\s+/g, ' ').trim();
        return { ...entry, characters: Array.from(text), folded: foldForSearch(text), foldedTitle: foldForSearch(`${entry.pageTitle} ${entry.title}`) };
      });
    }

    function searchPages(query) {
      const needle = foldForSearch(query.trim());
      if (!needle) { openPage(currentPage); return; }
      searchIndex = searchIndex || buildSearchIndex();
      const size = Array.from(needle).length;
      const matches = searchIndex.flatMap(entry => {
        const at = entry.folded.indexOf(needle);
        if (at < 0) return [];
        // Título da seção primeiro, depois o texto das seções, por último o texto solto da página.
        return [{ entry, at, score: entry.foldedTitle.includes(needle) ? 0 : entry.unit === null ? 2 : 1 }];
      }).sort((first, second) => first.score - second.score);
      const shown = matches.slice(0, 60);
      const excerpt = ({ entry, at }) => {
        const start = Math.max(0, at - 70);
        const end = Math.min(entry.characters.length, at + size + 110);
        const slice = (from, to) => escapeHtml(entry.characters.slice(from, to).join(''));
        return `${start ? '…' : ''}${slice(start, at)}<mark>${slice(at, at + size)}</mark>${slice(at + size, end)}${end < entry.characters.length ? '…' : ''}`;
      };
      content.innerHTML = `<p class="eyebrow">Busca local / ${matches.length} trecho(s)${matches.length > shown.length ? ` · mostrando ${shown.length}` : ''}</p><h2>Resultados</h2><p class="lede"><b>Enter</b> abre o primeiro resultado já na seção certa. <b>Esc</b> volta para a página.</p><div class="search-results">${shown.map(match => `<button class="result" data-page="${match.entry.id}"${match.entry.unit === null ? '' : ` data-unit="${match.entry.unit}"`} data-term="${escapeHtml(query.trim())}" type="button"><small>${escapeHtml(match.entry.pageTitle)}</small><strong>${escapeHtml(match.entry.title || match.entry.pageTitle)}</strong><p>${excerpt(match)}</p></button>`).join('') || '<div class="empty">Nenhuma entrada encontrada. Tente outro nome, em português ou inglês.</div>'}</div>`;
      document.querySelectorAll('.nav-item').forEach(button => button.classList.remove('active'));
    }

    document.addEventListener('click', event => {
      const workspaceTab = event.target.closest('[data-workspace]');
      if (workspaceTab) {
        setWorkspace(workspaceTab.dataset.workspace);
        const defaultPage = workspaceTab.dataset.workspace === 'campaigns' ? 'home' : 'screen';
        if (pageWorkspace[currentPage] !== currentWorkspace) openPage(defaultPage);
        return;
      }
      const tocChip = event.target.closest('[data-toc-index]');
      if (tocChip) { focusUnit(Number(tocChip.dataset.tocIndex), undefined, true); return; }
      const critButton = event.target.closest('[data-crit]');
      if (critButton) { rollCritical(critButton.dataset.crit); return; }
      const button = event.target.closest('[data-page]');
      if (button) openPage(button.dataset.page, button.dataset.unit === undefined ? undefined : { unit: Number(button.dataset.unit), term: button.dataset.term });
    });
    document.addEventListener('keydown', event => {
      const typing = event.target.closest && event.target.closest('input, textarea, select, [contenteditable]');
      if ((event.key === '/' && !typing) || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k')) {
        event.preventDefault();
        search.focus();
        search.select();
      }
    });
    search.addEventListener('keydown', event => {
      if (event.key === 'Escape') { openPage(currentPage); search.blur(); }
      if (event.key === 'Enter') {
        const first = content.querySelector('.result');
        if (first) { event.preventDefault(); first.click(); search.blur(); }
      }
    });
    navigation.addEventListener('change', event => {
      if (event.target.id !== 'campaign-picker') return;
      activeCampaignId = event.target.value;
      localStorage.setItem('night-city-active-campaign', activeCampaignId);
      buildNavigation();
      openPage(campaigns.find(campaign => campaign.id === activeCampaignId).groups[0].pages[0].id);
    });
    search.addEventListener('input', () => searchPages(search.value));
    if (!['campaigns', 'system'].includes(currentWorkspace)) currentWorkspace = 'campaigns';
    updateStickyOffset();
    buildNavigation();
    openPage('home');
    // Pré-carrega os documentos para a busca encontrar o texto completo deles.
    Promise.allSettled(Object.keys(markdownDocs).map(loadMarkdownDoc)).then(() => {
      searchIndex = null;
      if (search.value.trim()) searchPages(search.value);
    });
  </script>
