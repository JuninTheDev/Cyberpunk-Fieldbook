<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <title>Night City Fieldbook · Jogadores</title>
  <link rel="stylesheet" href="cyberpunk-css-main/cyberpunk-css-main/cyberpunk.css">
  <link rel="stylesheet" href="wiki.css">
  <link rel="stylesheet" href="netwire.css">
  <script>
    // O tema e a casca escolhidos no menu da conta (wikiApp.prefs "tema" e "casca"), antes de desenhar: sem piscar.
    try {
      const dono = localStorage.getItem('night-city-dono') || 'aparelho';
      if (JSON.parse(localStorage.getItem(`night-city-pref-${dono}-tema`) || 'null') === '2077') document.documentElement.dataset.tema = '2077';
      if (JSON.parse(localStorage.getItem(`night-city-pref-${dono}-casca`) || 'null') === 'classica') document.documentElement.dataset.casca = 'classica';
    } catch { /* sem armazenamento: fica o Fieldbook */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
</head>
<body>
  <div class="shell">
    <!-- A barra de cima vai de ponta a ponta, com a marca à esquerda (como nos exemplos de 2026). -->
    <header class="topbar">
      <div class="brand">
        <b class="brand-name">NIGHT CITY <em>FIELDBOOK</em></b>
        <div class="brand-mark">Visão dos jogadores</div>
        <p>O que o grupo sabe e as regras da mesa</p>
      </div>
      <div class="search-wrap">
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Buscar   ( / )" autocomplete="off" aria-label="Buscar na wiki: regra, pessoa, lugar">
      </div>
      <div class="top-meta">NIGHT CITY 2077 / VISÃO DOS JOGADORES</div>
    </header>
    <aside>
      <div class="workspace-tabs" role="tablist" aria-label="Área da wiki">
        <button class="workspace-tab" id="tab-campaigns" type="button" role="tab" aria-selected="true" data-workspace="campaigns">Campanha</button>
        <button class="workspace-tab" id="tab-system" type="button" role="tab" aria-selected="false" data-workspace="system">Regras</button>
      </div>
      <nav id="navigation" aria-label="Seções da wiki"></nav>
    </aside>
    <main>
      <article class="content" id="content" aria-live="polite"></article>
    </main>
  </div>
  <script src="system-catalog.js"></script>
  <script src="system-rules.js"></script>
  <script src="system-net.js"></script>
  <script src="system-2077.js"></script>
  <script src="system-blackchrome.js"></script>
  <script src="system-glossario.js"></script>
  <script src="system-criacao.js"></script>
  <script src="personagem-roles.js"></script>
  <script src="personagem-cyberware.js"></script>
  <script src="personagem-jogo.js"></script>
  <script src="loja-catalogo.js"></script>
  <script src="popup.js"></script>
  <script src="criador.js"></script>
  <script src="conta.js"></script>
  <script src="nightcity-map.js"></script>
  <script src="netwire.js"></script>
  <script>
    // Visão dos jogadores: o conteúdo de campanha vem da API (api/visao), publicado pelo mestre, e só das campanhas em
    // que este jogador joga (api/eu diz quais). Sem código, só as regras.
    // Este arquivo é baixado por qualquer um: não escreva aqui nomes ou segredos de campanha.
    const waiting = title => ({ eyebrow: 'Night City', title, lede: 'Carregando o que o mestre publicou…', html: '' });
    // Como jogamos: o guia do jogador, igual para todas as campanhas (sem nomes nem segredos: qualquer um baixa este arquivo).
    const button = (page, label) => `<button class="action" type="button" data-page="${page}">${label}</button>`;
    const playerGuide = {
      eyebrow: 'Night City / para os jogadores', title: 'Como jogamos',
      lede: 'O sistema, o seu personagem na wiki, como se ganha experiência e os combinados da mesa. O mestre confirma tudo na sessão zero.',
      html: `<div class="section" data-toc="O sistema"><h3>O sistema</h3><ul>
          <li><b>Cyberpunk RED</b>, com as regras dos anos 2070 do <b>Cyberpunk Edgerunners Mission Kit</b> (oficial). A mesa tem uma regra só: quando os dois dizem coisas diferentes, vale o Kit. A aba Regras já traz os dois juntos.</li>
          <li>O suplemento comunitário <b>Cyberpunk 2077</b> (feito por fãs, não oficial) não é mais usado nas regras. O mestre revisou os itens dele: os que entraram estão nos catálogos, com a etiqueta "suplemento de fã".</li>
          <li>O catálogo oficial do <b>Black Chrome</b> (de 2045) continua à venda: armas, cyberware, moda e armadura, equipamento e veículos, com a etiqueta Black Chrome.</li>
          <li>Os eventos do jogo Cyberpunk 2077 acontecem em paralelo à campanha, como pano de fundo. Não é preciso ter jogado; V não aparece.</li>
        </ul><p>${button('roles', 'Roles')} ${button('economy', 'Economia')} ${button('supplement2077', 'O que saiu do suplemento de fã')}</p></div>
        <div class="section" data-toc="Seu personagem"><h3>Seu personagem</h3><ul>
          <li><b>Entre</b> com o código que o mestre passou (no botão do canto de cima). O aparelho lembra.</li>
          <li><b>Crie</b> pelo criador, em Personagens: três métodos (Rato de Rua, Edgerunner e Pacote Completo) e a loja inicial, com o teto e as regras que o mestre escolheu.</li>
          <li><b>Envie ao mestre</b> quando estiver pronto. Ele leva para o Foundry, a mesa virtual.</li>
          <li><b>Depois do Foundry</b>, a ficha da mesa manda: na wiki você ainda muda nome, apelido, aparência, notas, retrato e Lifepath. Compras viram <b>pedidos</b> na Loja, que o mestre aprova.</li>
          <li><b>Anotações</b>, na Ficha: pistas, contatos, dívidas. Só você e o mestre leem.</li>
        </ul><p>${button('creation', 'Criação de personagens')} ${button('ficha', 'Ficha')}</p></div>
        <div class="section" data-toc="Experiência"><h3>Experiência</h3><ul>
          <li>No fim de cada sessão, o mestre dá <b>Pontos de Melhoria</b> pela tabela do livro: o grupo pela missão, e cada um pelo que fez de melhor no seu estilo (combate, apoio ao grupo, investigação ou interpretação).</li>
          <li>Os pontos sobem perícias e o Rank da Role, na página Avanço.</li>
          <li><b>Cromo custa Humanidade.</b> A partir de EMP 2 já há efeito; com EMP 0, ciberpsicose.</li>
        </ul><p>${button('advancement', 'Avanço e Pontos de Melhoria')} ${button('humanity', 'Humanidade')}</p></div>
        <div class="section" data-toc="Combinados da mesa"><h3>Combinados da mesa</h3><ul>
          <li>Cyberpunk lida com temas pesados: violência, perda do controle do corpo, trauma médico, corporações sem escrúpulo. Na sessão zero, a mesa combina as <b>linhas</b> (o que não entra no jogo) e os <b>véus</b> (o que acontece fora de cena).</li>
          <li><b>A carta X:</b> a qualquer momento, qualquer pessoa pode pedir para cortar uma cena ou um detalhe ("corta", ou o X da mesa), sem explicar por quê. A cena segue sem aquilo.</li>
          <li><b>O seu personagem é seu:</b> o mestre nunca tira o controle do seu personagem sem você ter combinado antes como isso pode acontecer.</li>
          <li>No fim da sessão, o mestre pergunta se algo deve ficar de fora da próxima. Diga, mesmo em particular.</li>
        </ul></div>
        <div class="section" data-toc="Na wiki"><h3>Na wiki</h3><ul>
          <li><b>Resumo:</b> o seu personagem, a próxima sessão (com o botão para pôr no calendário), os relógios que o mestre mostra e as últimas notícias.</li>
          <li><b>Sessões, Pessoas, Mapa e Notícias:</b> o que o grupo já sabe, publicado pelo mestre. O que é novo desde a sua última visita ganha um selo.</li>
          <li><b>Fixar:</b> o botão ☆ ao lado do título de qualquer página a põe no topo da barra lateral (Combate, a Ficha...).</li>
        </ul></div>`
    };
    const messagesPage = {
      eyebrow: 'Night City / NetWire', title: 'Mensagens', manterAlvo: true,
      lede: 'Os canais da cidade e as conversas com os seus contatos. Quando o canal aceita, você responde, e o mestre responde como o contato.',
      html: '<div data-nw-player></div>'
    };
    const playerGroups = [{ group: 'O que o grupo sabe', pages: [
      { id: 'pvHome', label: 'Resumo', icon: '00' },
      { id: 'pvMensagens', label: 'Mensagens', icon: 'MSG' },
      { id: 'pvSessions', label: 'Sessões', icon: 'S' },
      { id: 'pvPeople', label: 'Pessoas', icon: 'P' },
      { id: 'pvMap', label: 'Mapa', icon: 'MAP' },
      { id: 'pvNews', label: 'Notícias e handouts', icon: 'N' },
      { id: 'pvNightCity', label: 'Notícias de Night City', icon: 'N54' },
      { id: 'pvGuia', label: 'Como jogamos', icon: '?' }
    ]}, { group: 'Personagens', pages: [
      // Ficha e Loja abrem no personagem em uso (o do botão da conta, no canto de cima).
      { id: 'ficha', label: 'Ficha', icon: 'ID' },
      { id: 'personagens', label: 'Personagens', icon: 'PC' },
      { id: 'loja', label: 'Loja', icon: 'EB' }
    ]}];
    window.playerMapData = null;
    function startWiki(me) {
      const list = me && Array.isArray(me.campanhas) && me.campanhas.length ? me.campanhas : null;
      // ?campanha=<id> (o link "Abrir a visão dos jogadores" do mestre) abre direto nessa campanha.
      const wanted = new URLSearchParams(location.search).get('campanha');
      if (list && wanted && list.some(item => item.id === wanted)) { try { localStorage.setItem('night-city-jogadores-active-campaign', wanted); } catch { /* sem armazenamento */ } }
      window.playerIdentity = me;
      window.wikiConfig = {
        storagePrefix: 'night-city-jogadores',
        // As Mensagens do NetWire (netwire.js): canais da cidade e conversas com os NPCs.
        netwire: 'jogador',
        homePage: 'pvHome',
        // Sem campanha (sem código, ou sem servidor): uma de mentira, só para o menu (real: false).
        campaigns: list ? list.map(item => ({ id: item.id, name: item.nome, color: item.cor, groups: playerGroups })) : [{ id: 'grupo', name: 'Night City, 2077', real: false, groups: playerGroups }],
        pageContent: { pvMensagens: messagesPage, pvHome: waiting('Resumo'), pvSessions: waiting('Sessões'), pvPeople: waiting('Pessoas'), pvMap: waiting('Mapa'), pvNews: waiting('Notícias e handouts'), pvNightCity: waiting('Notícias de Night City'), pvGuia: playerGuide },
        mapPages: ['pvMap'],
        // As abas do topo (a casca NetWire): o menu do jogo. Mensagens, por enquanto, são as notícias e os handouts.
        topTabs: [
          { id: 'inicio', label: 'Início', inicio: true, paginas: ['pvGuia'] },
          { id: 'personagem', label: 'Personagem', curto: 'Ficha', paginas: ['ficha', 'personagens', 'loja', 'criador'] },
          { id: 'mensagens', label: 'Mensagens', curto: 'Msgs', paginas: ['pvMensagens', 'pvNews', 'pvNightCity'] },
          { id: 'campanha', label: 'Campanha', paginas: ['pvSessions', 'pvPeople'] },
          { id: 'mapa', label: 'Mapa', paginas: ['pvMap'] },
          { id: 'regras', label: 'Regras', area: 'system', pagina: 'combat' }
        ],
        mapData: () => window.playerMapData,
        pageSetup: { pvHome: content => window.playerView && window.playerView.setupHome(content), pvMensagens: (content, helpers) => window.netwire && window.netwire.setupPlayer(content, helpers) },
        // A coluna da direita (casca NetWire, telas largas): a próxima sessão e os relógios.
        sidePanel: page => (window.playerView && window.playerView.side ? window.playerView.side(page) : ''),
        topMeta: campaign => `${campaign.real === false ? 'Night City 2077' : campaign.name} / visão dos jogadores`.toUpperCase(),
        // Mesa do Foundry e "Entrar como mestre", na barra lateral.
        statusUrl: 'api/estado'
      };
      const script = document.createElement('script');
      script.src = 'wiki-app.js';
      script.onload = startPlayerView;
      document.body.appendChild(script);
    }
    if (location.protocol === 'file:') startWiki(null);
    else fetch('api/eu', { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).then(startWiki, () => startWiki(null));

    // Busca o que o mestre publicou a cada 15 segundos e atualiza as páginas quando há novidade.
    function startPlayerView() {
      const { escapeHtml, renderMarkdown, updatePages } = window.wikiApp;
      const me = window.playerIdentity;
      let lastUpdate = null;
      // As próximas sessões da agenda (para o botão do calendário) e o nome da campanha.
      let agendaNow = [];
      let agendaName = '';
      // O quadro da coluna da direita (a próxima sessão e os relógios), montado junto com as páginas.
      let sideNow = { next: '', clocks: '' };

      // ---------------- Novidades ----------------
      // O que o mestre publicou desde a última vez que este aparelho abriu cada página: selo no menu e "novo" no item.
      // Na primeira vez neste aparelho, nada é novidade.
      const NEWS_PAGES = { pvSessions: 'sessoes', pvPeople: 'npcs', pvMap: 'lugares', pvNews: 'noticias', pvNightCity: 'nightCity' };
      const itemKey = item => String(item.id || item.titulo || item.nome || '');
      let currentIds = {};
      // O que já foi visto fica na conta (igual no celular e no computador); o de antes, deste aparelho, ainda vale.
      const campaignKey = () => window.wikiApp.activeCampaign().id;
      const readSeen = () => {
        const value = window.wikiApp.prefs.get(`vistos:${campaignKey()}`);
        if (value !== undefined) return value;
        try { return JSON.parse(localStorage.getItem(`night-city-jogadores-vistos-${campaignKey()}`) || 'null'); } catch { return null; }
      };
      const writeSeen = seen => window.wikiApp.prefs.set(`vistos:${campaignKey()}`, seen);
      function markSeen(page) {
        if (!NEWS_PAGES[page] || !currentIds[page]) return;
        writeSeen({ ...(readSeen() || {}), [page]: currentIds[page] });
        window.wikiApp.setBadges({ [page]: 0 });
      }
      function updateBadges() {
        const seen = readSeen() || {};
        const open = window.wikiApp.currentPage();
        window.wikiApp.setBadges(Object.fromEntries(Object.keys(NEWS_PAGES).map(page => [page, page === open ? 0 : (currentIds[page] || []).filter(id => !(seen[page] || []).includes(id)).length])));
        markSeen(open);
      }
      document.addEventListener('wiki:pagina', event => markSeen(event.detail.id));
      // As preferências da conta chegaram: o que foi visto em outro aparelho não é mais novidade.
      document.addEventListener('wiki:preferencias', () => { if (Object.keys(currentIds).length) updateBadges(); });

      // ---------------- Seu personagem ----------------
      // O personagem em uso (o do botão da conta), no topo do Resumo, com a ficha e a loja a um clique.
      function renderMe(content = document.getElementById('content')) {
        const holder = content && content.querySelector('#pv-me');
        if (!holder) return;
        const account = window.playerAccount;
        if (!account || account.papel() !== 'jogador') { holder.innerHTML = ''; return; }
        const doc = account.selectedDoc();
        // Os números do resumo (api/personagens): o HP (o da mesa, quando houver), o IP e o dinheiro.
        const n = (doc && doc.numeros) || {};
        const hp = n.hp && n.hp.max ? n.hp : null;
        // Sem retrato, as iniciais em amarelo, como nos cartões de Personagens.
        const initials = name => (String(name || '').match(/\p{L}+/gu) || ['?']).slice(0, 2).map(word => word[0]).join('').toUpperCase();
        // O HP em 10 segmentos, como a barra da tela de personagem do jogo.
        const segments = hp ? Math.max(0, Math.min(10, Math.round(hp.atual / hp.max * 10))) : 0;
        const bar = hp ? `<div class="pv-me-vital"><small>HP${n.naMesa ? ' na mesa' : ''}</small><span class="nw-bar" aria-hidden="true">${Array.from({ length: 10 }, (_, index) => `<i${index < segments ? ' class="on"' : ''}></i>`).join('')}</span><b class="${hp.atual < hp.max ? 'pv-me-hurt' : ''}">${hp.atual}/${hp.max}</b></div>` : '';
        const number = (label, value) => (value === null || value === undefined ? '' : `<div class="pv-me-num"><small>${label}</small><b>${escapeHtml(String(value))}</b></div>`);
        const eddies = Number.isFinite(Number(n.eb)) && n.eb !== null && n.eb !== undefined ? `${Number(n.eb).toLocaleString('pt-BR')} eb` : null;
        holder.innerHTML = doc
          ? `<div class="pv-me-card">${doc.retrato ? `<img class="pv-me-portrait" src="${escapeHtml(doc.retrato)}" alt="" referrerpolicy="no-referrer">` : `<span class="cc-initials" aria-hidden="true">${escapeHtml(initials(doc.nome))}</span>`}<div class="pv-me-text"><span class="tag">Seu personagem</span><h3>${escapeHtml(doc.nome || 'Sem nome')}${doc.apelido ? ` <small>"${escapeHtml(doc.apelido)}"</small>` : ''}</h3><p>${escapeHtml(account.rolesLabel(doc))}</p>${bar || eddies || n.ip !== undefined ? `<div class="pv-me-stats">${bar}${number('Eddies', eddies)}${number('IP', n.ip)}</div>` : ''}</div><div class="pv-me-actions"><button class="action solid" type="button" data-page="ficha">Ficha</button><button class="action" type="button" data-page="loja">Loja</button><button class="action ghost" type="button" data-pv-switch>Trocar</button></div></div>`
          : '<div class="pv-me-card pv-me-empty"><div class="pv-me-text"><span class="tag">Seu personagem</span><h3>Nenhum ainda</h3><p>Crie o seu personagem para esta campanha. O mestre leva para o Foundry quando estiver pronto.</p></div><div class="pv-me-actions"><button class="action" type="button" data-pv-new>Criar personagem</button></div></div>';
      }
      document.addEventListener('wiki:personagem', () => renderMe());
      document.addEventListener('click', event => {
        // Abre o menu da conta depois deste clique (senão o próprio clique, fora do menu, o fecharia).
        if (event.target.closest('[data-pv-switch]')) setTimeout(() => window.playerAccount && window.playerAccount.open(), 0);
        if (event.target.closest('[data-pv-new]')) setTimeout(() => { window.playerAccount && window.playerAccount.open(); document.querySelector('[data-account-new]')?.click(); }, 0);
        const ics = event.target.closest('[data-pv-ics]');
        const session = ics && agendaNow.find(item => item.id === ics.dataset.pvIcs);
        if (session) window.wikiApp.downloadSession(session, agendaName);
      });

      const mapHtml = hasPlaces => window.nightCityMap.renderPage(window.playerMapData, { empty: !hasPlaces });

      function buildPages(data, seen) {
        const fresh = (page, item) => Boolean(seen) && !(seen[page] || []).includes(itemKey(item));
        const tag = (page, item) => (fresh(page, item) ? ' <span class="pv-new">novo</span>' : '');
        const people = data.npcs || [];
        const places = data.lugares || [];
        const news = data.noticias || [];
        const city = data.nightCity || [];
        const sessions = data.sessoes || [];
        const clocks = data.relogios || [];
        const sessionTitle = (item, index) => item.titulo || `Sessão ${index + 1}`;
        // O endereço da seção (#pvSessions/sessao-02...), como a wiki faz: sem acento, minúsculo, com hífens.
        const sectionSlug = text => String(text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const lastSession = sessions.length ? sessions[sessions.length - 1] : null;
        const newPlaces = places.filter(place => fresh('pvMap', place));
        const name = (data.campanha && data.campanha.nome) || 'Night City';
        const updated = data.atualizado ? new Date(data.atualizado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        // A próxima sessão marcada na agenda do mestre (e as seguintes, numa linha).
        agendaNow = (data.agenda || []).filter(item => Date.parse(item.inicio) + item.duracao * 60000 > Date.now());
        agendaName = name;
        const next = agendaNow[0];
        const when = next ? window.wikiApp.sessionTime(next) : null;
        const nextHtml = next ? `<div class="section pv-next" data-toc="Próxima sessão"><h3>Próxima sessão</h3><p class="pv-next-when"><b>${escapeHtml(when.data)}</b>, ${escapeHtml(when.horario)} · ${escapeHtml(when.relativo)}</p>${next.titulo ? `<p><b>${escapeHtml(next.titulo)}</b></p>` : ''}${next.nota ? `<p>${escapeHtml(next.nota)}</p>` : ''}<p><button class="action" type="button" data-pv-ics="${escapeHtml(next.id)}">Adicionar ao calendário</button></p>${agendaNow.length > 1 ? `<p class="note-status">Depois: ${agendaNow.slice(1).map(item => escapeHtml(window.wikiApp.sessionTime(item).curto)).join(' · ')}</p>` : ''}</div>` : '';
        window.playerMapData = {
          width: 5600, height: 5320, images: { base: 'nightcity-map-base.webp' },
          // Os lugares novos desde a última visita: outra cor, e a legenda diz o que é.
          categories: { lugar: { label: 'Lugar que o grupo conhece', color: '#00ffd2' }, ...(newPlaces.length ? { novo: { label: 'Novo desde a sua última visita', color: '#ff3158' } } : {}) },
          markers: places.map((place, index) => ({ id: place.id || `lugar-${index}`, code: String(index + 1), title: `${place.nome || 'Lugar'}${fresh('pvMap', place) ? ' (novo)' : ''}`, district: place.distrito || '', x: Number(place.x) || 0, y: Number(place.y) || 0, category: fresh('pvMap', place) ? 'novo' : 'lugar', detail: place.texto || '' }))
        };
        // Mensagens no Início: o que é novo desde a última visita (notícias, Night City, sessões, pessoas, lugares), como
        // as mensagens do NetWire; sem nada novo, as três últimas notícias.
        const SOURCES = [['pvNews', news, 'Notícias e handouts'], ['pvNightCity', city, 'N54 News'], ['pvSessions', sessions, 'Sessões'], ['pvPeople', people, 'Pessoas'], ['pvMap', places, 'Mapa']];
        const unread = SOURCES.flatMap(([page, items, label]) => items.filter(item => fresh(page, item)).map(item => ({ page, item, label })));
        const shown = unread.length ? unread.slice(0, 4) : [...news.slice(0, 2).map(item => ({ page: 'pvNews', item, label: 'Notícias e handouts' })), ...city.slice(0, 1).map(item => ({ page: 'pvNightCity', item, label: 'N54 News' }))];
        const excerpt = text => { const plain = String(text || '').replace(/[#*_>`[\]|]/g, '').replace(/\s+/g, ' ').trim(); return plain.length > 140 ? `${plain.slice(0, 139)}…` : plain; };
        const inboxHtml = shown.length ? `<div class="section pv-inbox" data-toc="${unread.length ? 'Não lidas' : 'Últimas mensagens'}"><h3>${unread.length ? 'Não lidas' : 'Últimas mensagens'}${unread.length ? `<span class="ref">${unread.length}</span>` : ''}</h3>${shown.map(({ page, item, label }) => `<div class="nw-msg"><button type="button" class="nw-msg-body pv-inbox-item" data-page="${page}"><b>${escapeHtml(item.titulo || item.nome || 'Sem título')}</b>${excerpt(item.texto) ? `<span>${escapeHtml(excerpt(item.texto))}</span>` : ''}</button><div class="nw-msg-foot"><b>${escapeHtml(label)}</b>${item.data ? ` · ${escapeHtml(item.data)}` : ''}</div></div>`).join('')}<p><button class="action" type="button" data-page="pvMensagens">Abrir as mensagens</button></p></div>` : '';
        const clocksHtml = clocks.length ? `<div class="section" data-toc="Relógios"><h3>Relógios</h3>${clocks.map(clock => `<p class="pv-clock-name"><b>${escapeHtml(clock.nome)}</b> ${clock.valor}/${clock.passos.length}${clock.valor && clock.passos[clock.valor - 1] ? ` · agora: ${escapeHtml(clock.passos[clock.valor - 1])}` : ''}</p><div class="clock clock-readonly">${clock.passos.map((step, index) => `<span class="clock-segment" aria-pressed="${index < clock.valor}"><span>${index + 1}</span>${escapeHtml(step)}</span>`).join('')}</div>`).join('')}</div>` : '';
        // O quadro da coluna da direita (telas largas), nas outras páginas: a próxima sessão e os relógios, em pequeno.
        sideNow = {
          next: next ? `<div class="nw-pad pv-side-next"><p class="nw-pad-title">Próxima sessão</p><p><b>${escapeHtml(when.data)}</b>, ${escapeHtml(when.horario)}</p><p class="note-status">${escapeHtml(when.relativo)}${next.titulo ? ` · ${escapeHtml(next.titulo)}` : ''}</p></div>` : '',
          clocks: clocks.length ? `<div class="nw-pad pv-side-clocks"><p class="nw-pad-title">Relógios</p>${clocks.map(clock => `<p class="pv-side-clock"><span>${escapeHtml(clock.nome)}</span><b>${clock.valor}/${clock.passos.length}</b></p><span class="nw-bar" aria-hidden="true">${clock.passos.map((_, index) => `<i${index < clock.valor ? ' class="on"' : ''}></i>`).join('')}</span>`).join('')}</div>` : ''
        };
        const newsHtml = (items, page) => items.map(item => `<div class="section" data-toc="${escapeHtml(item.titulo || 'Notícia')}"><h3>${escapeHtml(item.titulo || 'Notícia')}${tag(page, item)}</h3>${item.data ? `<p class="pv-news-date">${escapeHtml(item.data)}</p>` : ''}<div class="md-doc">${renderMarkdown(item.texto || '')}</div></div>`).join('');
        return {
          pvHome: {
            eyebrow: `${escapeHtml(name)}${updated ? ` / atualizado em ${updated}` : ''}`, title: 'O que o grupo sabe',
            lede: 'Resumo da campanha até agora, publicado pelo mestre. Esta página se atualiza sozinha.',
            // O menu de personagem do jogo: o cartão, a próxima sessão e as mensagens em cima; o resumo, os relógios e a
            // última sessão embaixo.
            html: `<div id="pv-me"></div><div class="pv-home-grid">${nextHtml}${inboxHtml}</div><div class="section" data-toc="Resumo"><h3>Resumo</h3><div class="md-doc">${renderMarkdown(data.resumo || 'Nada publicado ainda.')}</div></div>${clocksHtml}${lastSession ? `<div class="section" data-toc="Última sessão"><h3>Última sessão${tag('pvSessions', lastSession)}</h3><p><b>${escapeHtml(sessionTitle(lastSession, sessions.length - 1))}</b>${lastSession.data ? ` · ${escapeHtml(lastSession.data)}` : ''}</p><button class="action" type="button" data-page="pvSessions" data-section="${escapeHtml(sectionSlug(sessionTitle(lastSession, sessions.length - 1)))}">Ler o resumo</button></div>` : ''}`
          },
          pvSessions: {
            eyebrow: `${escapeHtml(name)} / sessões`, title: 'Sessões',
            lede: 'O que aconteceu em cada sessão, na ordem, contado pelo mestre. A barra "Nesta página" pula para cada uma.',
            html: sessions.length ? sessions.map((item, index) => `<div class="section" data-toc="${escapeHtml(sessionTitle(item, index))}"><h3>${escapeHtml(sessionTitle(item, index))}${tag('pvSessions', item)}</h3>${item.data ? `<p class="pv-news-date">${escapeHtml(item.data)}</p>` : ''}<div class="md-doc">${renderMarkdown(item.texto || '')}</div></div>`).join('') : '<div class="callout">Nenhuma sessão publicada ainda. O mestre publica o resumo de cada sessão aqui.</div>'
          },
          pvPeople: {
            eyebrow: `${escapeHtml(name)} / pessoas`, title: 'Pessoas',
            lede: 'Quem o grupo já conheceu e o que sabe sobre cada um.',
            html: people.length ? `<div class="cards">${people.map(person => `<div class="person"><h3>${escapeHtml(person.nome)}${tag('pvPeople', person)}</h3>${person.papel ? `<div class="role">${escapeHtml(person.papel)}</div>` : ''}<div class="md-doc">${renderMarkdown(person.texto || '')}</div></div>`).join('')}</div>` : '<div class="callout">Ninguém ainda. As pessoas aparecem aqui conforme o grupo as conhece.</div>'
          },
          pvMap: {
            eyebrow: `${escapeHtml(name)} / mapa`, title: 'Night City',
            lede: 'Os lugares que o grupo já conhece. Arraste para mover, use os botões ou a roda do mouse para zoom.',
            html: mapHtml(places.length > 0)
          },
          pvNews: {
            eyebrow: `${escapeHtml(name)} / notícias`, title: 'Notícias e handouts',
            lede: 'Boletins, mensagens e documentos que o grupo recebeu. Os mais recentes primeiro.',
            html: news.length ? newsHtml(news, 'pvNews') : '<div class="callout">Nenhuma notícia ainda.</div>'
          },
          pvNightCity: {
            eyebrow: 'Night City / N54 News', title: 'Notícias de Night City',
            lede: 'O que a cidade inteira está comentando: boletins, manchetes e rumores. Os mais recentes primeiro.',
            html: city.length ? newsHtml(city, 'pvNightCity') : '<div class="callout">Nenhuma notícia da cidade ainda.</div>'
          }
        };
      }

      // Sem campanha para mostrar: sem código (entra aqui mesmo), código sem campanha, ou sem servidor.
      function emptyPages(kind) {
        const text = {
          visitante: 'Entre com o código que o mestre te passou para ver o que o seu grupo sabe. As regras estão na aba Regras.',
          semCampanha: 'O seu código ainda não está em nenhuma campanha. Fale com o mestre.',
          offline: 'Esta página precisa ser aberta pelo servidor do mestre (o endereço que ele passou). As regras continuam disponíveis na aba Regras.'
        }[kind];
        const callout = `<div class="callout">${text}</div>`;
        const login = kind === 'visitante' ? '<div class="section" data-toc="Entrar"><h3>Entrar</h3><form class="cc-login" data-pv-login><input id="pv-code" autocomplete="off" placeholder="NC-XXXX-XXXX" aria-label="Código do jogador"><button class="action" type="submit">Entrar</button></form><p class="cc-msg" id="pv-login-msg"></p></div>' : '';
        const titles = { pvSessions: 'Sessões', pvPeople: 'Pessoas', pvMap: 'Mapa', pvNews: 'Notícias e handouts', pvNightCity: 'Notícias de Night City' };
        return {
          pvHome: { eyebrow: 'Night City', title: kind === 'offline' ? 'Sem conexão' : 'O que o grupo sabe', lede: kind === 'visitante' ? 'Cada jogador vê a campanha em que joga.' : 'Não consegui ler o que o mestre publicou.', html: `${callout}${login}` },
          ...Object.fromEntries(Object.entries(titles).map(([id, title]) => [id, { eyebrow: 'Night City', title, lede: '', html: callout }]))
        };
      }
      // Entrar pela página inicial: o menu passa a ter as campanhas do jogador.
      window.playerView = {
        // No Início, a próxima sessão e os relógios já estão na página: a coluna fica só com o índice.
        side: page => (page === 'pvHome' ? '' : `${sideNow.next}${sideNow.clocks}`),
        setupHome(content) {
          renderMe(content);
          const form = content.querySelector('[data-pv-login]');
          if (!form) return;
          form.onsubmit = async event => {
            event.preventDefault();
            const message = content.querySelector('#pv-login-msg');
            try {
              const response = await fetch('api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo: content.querySelector('#pv-code').value.trim() }) });
              if (response.ok) return location.reload();
              message.textContent = (await response.json().catch(() => ({}))).erro || 'Não deu certo.';
            } catch { message.textContent = 'Sem conexão com o servidor da wiki.'; }
          };
        }
      };

      function toast(text) {
        const element = document.createElement('div');
        element.className = 'pv-toast';
        element.textContent = text;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 4000);
      }

      function refresh() {
        const campaign = window.wikiApp.activeCampaign();
        if (!campaign || campaign.real === false) {
          if (lastUpdate !== null) return;
          lastUpdate = '';
          updatePages(emptyPages(!me ? 'offline' : me.papel === 'visitante' ? 'visitante' : 'semCampanha'));
          return;
        }
        const id = campaign.id;
        fetch(`api/visao?campanha=${encodeURIComponent(id)}`, { cache: 'no-store' })
          .then(response => response.ok ? response.json() : Promise.reject(new Error(response.status)))
          .then(data => {
            if (window.wikiApp.activeCampaign().id !== id) return; // trocou de campanha enquanto lia
            if (data.atualizado && data.atualizado === lastUpdate) return;
            const first = lastUpdate === null;
            lastUpdate = data.atualizado || '';
            currentIds = Object.fromEntries(Object.entries(NEWS_PAGES).map(([page, list]) => [page, (data[list] || []).map(itemKey).filter(Boolean)]));
            let seen = readSeen();
            if (!seen) { seen = currentIds; writeSeen(seen); }
            updatePages(buildPages(data, seen));
            updateBadges();
            renderMe();
            if (!first) toast('O mestre publicou novidades');
          })
          .catch(() => {
            if (lastUpdate !== null) return;
            lastUpdate = '';
            updatePages(emptyPages('offline'));
          });
      }
      // Trocou de campanha no menu: lê a nova do zero.
      document.addEventListener('wiki:campanha', () => {
        lastUpdate = null;
        currentIds = {};
        sideNow = { next: '', clocks: '' };
        window.wikiApp.setBadges(Object.fromEntries(Object.keys(NEWS_PAGES).map(page => [page, 0])));
        window.playerMapData = null;
        updatePages({ pvHome: waiting('Resumo'), pvSessions: waiting('Sessões'), pvPeople: waiting('Pessoas'), pvMap: waiting('Mapa'), pvNews: waiting('Notícias e handouts'), pvNightCity: waiting('Notícias de Night City') });
        refresh();
      });

      refresh();
      setInterval(refresh, 15000);
    }
  </script>
</body>
</html>
