<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111614">
  <title>Night City Fieldbook · Jogadores</title>
  <link rel="stylesheet" href="cyberpunk-css-main/cyberpunk-css-main/cyberpunk.css">
  <link rel="stylesheet" href="wiki.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="brand-mark">Visão dos jogadores</div>
        <h1><span class="cyberpunk-font-og" aria-label="Cyberpunk"><span class="c">C</span>yber<span class="p">P</span>unk</span><br>Fieldbook</h1>
        <p>O que o grupo sabe e as regras da mesa</p>
      </div>
      <div class="workspace-tabs" role="tablist" aria-label="Área da wiki">
        <button class="workspace-tab" id="tab-campaigns" type="button" role="tab" aria-selected="true" data-workspace="campaigns">Campanha</button>
        <button class="workspace-tab" id="tab-system" type="button" role="tab" aria-selected="false" data-workspace="system">Regras</button>
      </div>
      <nav id="navigation" aria-label="Seções da wiki"></nav>
    </aside>
    <main>
      <header class="topbar">
        <div class="search-wrap">
          <span class="search-glyph" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Buscar regra, pessoa, lugar…   ( / )" autocomplete="off" aria-label="Buscar na wiki">
        </div>
        <div class="top-meta">NIGHT CITY 2077 / VISÃO DOS JOGADORES</div>
      </header>
      <article class="content" id="content" aria-live="polite"></article>
    </main>
  </div>
  <script src="system-catalog.js"></script>
  <script src="system-rules.js"></script>
  <script src="system-net.js"></script>
  <script src="system-2077.js"></script>
  <script src="system-glossario.js"></script>
  <script src="system-criacao.js"></script>
  <script src="loja-catalogo.js"></script>
  <script src="popup.js"></script>
  <script src="criador.js"></script>
  <script>
    // Visão dos jogadores: o conteúdo de campanha vem da API (api/visao), publicado pelo mestre, e só das campanhas em
    // que este jogador joga (api/eu diz quais). Sem código, só as regras.
    // Este arquivo é baixado por qualquer um: não escreva aqui nomes ou segredos de campanha.
    const waiting = title => ({ eyebrow: 'Night City', title, lede: 'Carregando o que o mestre publicou…', html: '' });
    const playerGroups = [{ group: 'O que o grupo sabe', pages: [
      { id: 'pvHome', label: 'Resumo', icon: '00' },
      { id: 'pvPeople', label: 'Pessoas', icon: 'P' },
      { id: 'pvMap', label: 'Mapa', icon: 'MAP' },
      { id: 'pvNews', label: 'Notícias e handouts', icon: 'N' },
      { id: 'pvNightCity', label: 'Notícias de Night City', icon: 'N54' }
    ]}, { group: 'Personagens', pages: [
      { id: 'personagens', label: 'Personagens', icon: 'PC' },
      { id: 'loja', label: 'Loja', icon: 'EB' }
    ]}];
    window.playerMapData = null;
    function startWiki(me) {
      const list = me && Array.isArray(me.campanhas) && me.campanhas.length ? me.campanhas : null;
      // ?campanha=<id> (o link "Abrir a visão dos jogadores" do mestre) abre direto nessa campanha.
      const wanted = new URLSearchParams(location.search).get('campanha');
      if (list && wanted && list.some(item => item.id === wanted)) { try { localStorage.setItem('night-city-jogadores-active-campaign', wanted); } catch { /* sem armazenamento */ } }
      window.playerIdentity = me;
      window.wikiConfig = {
        storagePrefix: 'night-city-jogadores',
        homePage: 'pvHome',
        // Sem campanha (sem código, ou sem servidor): uma de mentira, só para o menu (real: false).
        campaigns: list ? list.map(item => ({ id: item.id, name: item.nome, color: item.cor, groups: playerGroups })) : [{ id: 'grupo', name: 'Night City, 2077', real: false, groups: playerGroups }],
        pageContent: { pvHome: waiting('Resumo'), pvPeople: waiting('Pessoas'), pvMap: waiting('Mapa'), pvNews: waiting('Notícias e handouts'), pvNightCity: waiting('Notícias de Night City') },
        mapPages: ['pvMap'],
        mapData: () => window.playerMapData,
        pageSetup: { pvMap: () => window.wikiApp.setupMap(), pvHome: content => window.playerView && window.playerView.setupHome(content) },
        topMeta: campaign => `${campaign.real === false ? 'Night City 2077' : campaign.name} / visão dos jogadores`.toUpperCase(),
        // Mesa do Foundry e "Entrar como mestre", na barra lateral.
        statusUrl: 'api/estado'
      };
      const script = document.createElement('script');
      script.src = 'wiki-app.js';
      script.onload = startPlayerView;
      document.body.appendChild(script);
    }
    if (location.protocol === 'file:') startWiki(null);
    else fetch('api/eu', { cache: 'no-store' }).then(response => (response.ok ? response.json() : null)).then(startWiki, () => startWiki(null));

    // Busca o que o mestre publicou a cada 15 segundos e atualiza as páginas quando há novidade.
    function startPlayerView() {
      const { escapeHtml, renderMarkdown, updatePages } = window.wikiApp;
      const me = window.playerIdentity;
      let lastUpdate = null;

      const mapHtml = hasPlaces => `${hasPlaces ? '' : '<div class="callout">Nenhum lugar marcado ainda. Eles aparecem aqui conforme o grupo descobre.</div>'}
        <div class="map-toolbar"><div class="map-zoom-controls" aria-label="Controles de zoom"><button type="button" data-map-action="zoom-out" aria-label="Diminuir zoom" title="Diminuir zoom">−</button><button type="button" data-map-action="reset" aria-label="Enquadrar mapa" title="Enquadrar mapa">⌖</button><button type="button" data-map-action="zoom-in" aria-label="Aumentar zoom" title="Aumentar zoom">+</button></div></div>
        <div class="map-filter-list" id="map-filters" hidden></div>
        <div class="campaign-map-layout"><div class="campaign-map-main"><div class="campaign-map-canvas"><svg id="nightcity-map" viewBox="0 0 5600 5320" role="img" aria-label="Mapa de Night City com os lugares que o grupo conhece"><image id="nightcity-map-image" href="nightcity-map-base.jpg" x="0" y="0" width="5600" height="5320" preserveAspectRatio="none"></image><g id="nightcity-map-pins"></g></svg></div><div class="map-legend" id="map-legend"></div></div>
        <section class="map-detail-panel" aria-live="polite"><div id="map-marker-detail" class="map-marker-detail"><h3>Escolha um ponto</h3></div><div class="map-marker-list" id="map-marker-list"></div></section></div>`;

      function buildPages(data) {
        const people = data.npcs || [];
        const places = data.lugares || [];
        const news = data.noticias || [];
        const city = data.nightCity || [];
        const name = (data.campanha && data.campanha.nome) || 'Night City';
        const updated = data.atualizado ? new Date(data.atualizado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        window.playerMapData = {
          width: 5600, height: 5320, images: { base: 'nightcity-map-base.jpg' },
          categories: { lugar: { label: 'Lugar que o grupo conhece', color: '#00ffd2' } },
          markers: places.map((place, index) => ({ id: place.id || `lugar-${index}`, code: String(index + 1), title: place.nome || 'Lugar', district: place.distrito || '', x: Number(place.x) || 0, y: Number(place.y) || 0, category: 'lugar', detail: place.texto || '' }))
        };
        const newsHtml = items => items.map(item => `<div class="section" data-toc="${escapeHtml(item.titulo || 'Notícia')}"><h3>${escapeHtml(item.titulo || 'Notícia')}</h3>${item.data ? `<p class="pv-news-date">${escapeHtml(item.data)}</p>` : ''}<div class="md-doc">${renderMarkdown(item.texto || '')}</div></div>`).join('');
        return {
          pvHome: {
            eyebrow: `${escapeHtml(name)}${updated ? ` / atualizado em ${updated}` : ''}`, title: 'O que o grupo sabe',
            lede: 'Resumo da campanha até agora, publicado pelo mestre. Esta página se atualiza sozinha.',
            html: `<div class="section" data-toc="Resumo"><h3>Resumo</h3><div class="md-doc">${renderMarkdown(data.resumo || 'Nada publicado ainda.')}</div></div>${news.length ? `<div class="section" data-toc="Últimas notícias"><h3>Últimas notícias</h3><ul>${news.slice(0, 3).map(item => `<li><button class="action" type="button" data-page="pvNews">${escapeHtml(item.titulo || 'Notícia')}</button></li>`).join('')}</ul></div>` : ''}${city.length ? `<div class="section" data-toc="Night City"><h3>Night City</h3><ul>${city.slice(0, 3).map(item => `<li><button class="action" type="button" data-page="pvNightCity">${escapeHtml(item.titulo || 'Notícia')}</button></li>`).join('')}</ul></div>` : ''}`
          },
          pvPeople: {
            eyebrow: `${escapeHtml(name)} / pessoas`, title: 'Pessoas',
            lede: 'Quem o grupo já conheceu e o que sabe sobre cada um.',
            html: people.length ? `<div class="cards">${people.map(person => `<div class="person"><h3>${escapeHtml(person.nome)}</h3>${person.papel ? `<div class="role">${escapeHtml(person.papel)}</div>` : ''}<div class="md-doc">${renderMarkdown(person.texto || '')}</div></div>`).join('')}</div>` : '<div class="callout">Ninguém ainda. As pessoas aparecem aqui conforme o grupo as conhece.</div>'
          },
          pvMap: {
            eyebrow: `${escapeHtml(name)} / mapa`, title: 'Night City',
            lede: 'Os lugares que o grupo já conhece. Arraste para mover, use os botões ou a roda do mouse para zoom.',
            html: mapHtml(places.length > 0)
          },
          pvNews: {
            eyebrow: `${escapeHtml(name)} / notícias`, title: 'Notícias e handouts',
            lede: 'Boletins, mensagens e documentos que o grupo recebeu. Os mais recentes primeiro.',
            html: news.length ? newsHtml(news) : '<div class="callout">Nenhuma notícia ainda.</div>'
          },
          pvNightCity: {
            eyebrow: 'Night City / N54 News', title: 'Notícias de Night City',
            lede: 'O que a cidade inteira está comentando: boletins, manchetes e rumores. Os mais recentes primeiro.',
            html: city.length ? newsHtml(city) : '<div class="callout">Nenhuma notícia da cidade ainda.</div>'
          }
        };
      }

      // Sem campanha para mostrar: sem código (entra aqui mesmo), código sem campanha, ou sem servidor.
      function emptyPages(kind) {
        const text = {
          visitante: 'Entre com o código que o mestre te passou para ver o que o seu grupo sabe. As regras estão na aba Regras.',
          semCampanha: 'O seu código ainda não está em nenhuma campanha. Fale com o mestre.',
          offline: 'Esta página precisa ser aberta pelo servidor do mestre (o endereço que ele passou). As regras continuam disponíveis na aba Regras.'
        }[kind];
        const callout = `<div class="callout">${text}</div>`;
        const login = kind === 'visitante' ? '<div class="section" data-toc="Entrar"><h3>Entrar</h3><form class="cc-login" data-pv-login><input id="pv-code" autocomplete="off" placeholder="NC-XXXX-XXXX" aria-label="Código do jogador"><button class="action" type="submit">Entrar</button></form><p class="cc-msg" id="pv-login-msg"></p></div>' : '';
        const titles = { pvPeople: 'Pessoas', pvMap: 'Mapa', pvNews: 'Notícias e handouts', pvNightCity: 'Notícias de Night City' };
        return {
          pvHome: { eyebrow: 'Night City', title: kind === 'offline' ? 'Sem conexão' : 'O que o grupo sabe', lede: kind === 'visitante' ? 'Cada jogador vê a campanha em que joga.' : 'Não consegui ler o que o mestre publicou.', html: `${callout}${login}` },
          ...Object.fromEntries(Object.entries(titles).map(([id, title]) => [id, { eyebrow: 'Night City', title, lede: '', html: callout }]))
        };
      }
      // Entrar pela página inicial: o menu passa a ter as campanhas do jogador.
      window.playerView = {
        setupHome(content) {
          const form = content.querySelector('[data-pv-login]');
          if (!form) return;
          form.onsubmit = async event => {
            event.preventDefault();
            const message = content.querySelector('#pv-login-msg');
            try {
              const response = await fetch('api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo: content.querySelector('#pv-code').value.trim() }) });
              if (response.ok) return location.reload();
              message.textContent = (await response.json().catch(() => ({}))).erro || 'Não deu certo.';
            } catch { message.textContent = 'Sem conexão com o servidor da wiki.'; }
          };
        }
      };

      function toast(text) {
        const element = document.createElement('div');
        element.className = 'pv-toast';
        element.textContent = text;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 4000);
      }

      function refresh() {
        const campaign = window.wikiApp.activeCampaign();
        if (!campaign || campaign.real === false) {
          if (lastUpdate !== null) return;
          lastUpdate = '';
          updatePages(emptyPages(!me ? 'offline' : me.papel === 'visitante' ? 'visitante' : 'semCampanha'));
          return;
        }
        const id = campaign.id;
        fetch(`api/visao?campanha=${encodeURIComponent(id)}`, { cache: 'no-store' })
          .then(response => response.ok ? response.json() : Promise.reject(new Error(response.status)))
          .then(data => {
            if (window.wikiApp.activeCampaign().id !== id) return; // trocou de campanha enquanto lia
            if (data.atualizado && data.atualizado === lastUpdate) return;
            const first = lastUpdate === null;
            lastUpdate = data.atualizado || '';
            updatePages(buildPages(data));
            if (!first) toast('O mestre publicou novidades');
          })
          .catch(() => {
            if (lastUpdate !== null) return;
            lastUpdate = '';
            updatePages(emptyPages('offline'));
          });
      }
      // Trocou de campanha no menu: lê a nova do zero.
      document.addEventListener('wiki:campanha', () => {
        lastUpdate = null;
        window.playerMapData = null;
        updatePages({ pvHome: waiting('Resumo'), pvPeople: waiting('Pessoas'), pvMap: waiting('Mapa'), pvNews: waiting('Notícias e handouts'), pvNightCity: waiting('Notícias de Night City') });
        refresh();
      });

      refresh();
      setInterval(refresh, 15000);
    }
  </script>
</body>
</html>
